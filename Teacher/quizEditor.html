    <script>
        // Global Variables
        let quizTests = [];
        let slides = [];
        let currentSlide = 0;
        let gameUrl = null;
        let gameSlideIndex = null;
        let lastDescription = "";
        let isAutoSaveEnabled = true;
        let autoSaveInterval = 30000; // 30 seconds
        let autoSaveTimeout;
        let lastCanvasState = '';

        // Initialize Fabric.js Canvas with correct dimensions
        const canvas = new fabric.Canvas('canvas', {
            backgroundColor: '#fff',
            width: 1280,
            height: 720
        });

        // Utility Functions
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        // Burger Menu Functionality
        const burgerBtn = document.getElementById('burger-menu-btn');
        const burgerDropdown = document.getElementById('burger-dropdown');

        burgerBtn.addEventListener('click', function(e) {
            const isVisible = burgerDropdown.style.display === 'block';
            burgerDropdown.style.display = isVisible ? 'none' : 'block';
            e.stopPropagation();
        });

        document.addEventListener('click', function(e) {
            if (!burgerDropdown.contains(e.target) && e.target !== burgerBtn) {
                burgerDropdown.style.display = 'none';
            }
        });

        // Burger menu actions
        document.getElementById('burger-export').onclick = function(e) {
            e.preventDefault();
            document.getElementById('export-btn').click();
            burgerDropdown.style.display = 'none';
        };

        document.getElementById('burger-import').onclick = function(e) {
            e.preventDefault();
            document.getElementById('import-btn').click();
            burgerDropdown.style.display = 'none';
        };

        // Canvas Scaling
        const scaleInput = document.getElementById('canvas-scale');
        const scaleValue = document.getElementById('canvas-scale-value');
        const canvasWrapper = document.querySelector('.canvas-wrapper');

        function updateCanvasScale() {
            const scale = parseFloat(scaleInput.value);
            canvasWrapper.style.transform = `scale(${scale})`;
            canvasWrapper.classList.add('scaled');
            scaleValue.textContent = Math.round(scale * 100) + '%';
        }

        scaleInput.addEventListener('input', updateCanvasScale);
        document.getElementById('reset-zoom-btn').onclick = function() {
            scaleInput.value = 0.8;
            updateCanvasScale();
        };

        // Initialize scale
        updateCanvasScale();

        // Canvas initialization and sizing - maintain 1280x720
        function resizeCanvas() {
            // Keep canvas at fixed 1280x720 dimensions to match CSS
            canvas.setWidth(1280);
            canvas.setHeight(720);
            canvas.calcOffset && canvas.calcOffset();
            canvas.renderAll();
            
            // Ensure canvas element is visible
            const canvasElement = document.getElementById('canvas');
            if (canvasElement) {
                canvasElement.style.display = 'block';
                canvasElement.style.visibility = 'visible';
                canvasElement.style.opacity = '1';
            }
            
            console.log('Canvas resized to:', canvas.width, 'x', canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        // Initialize canvas properly after DOM is ready
        setTimeout(() => {
            resizeCanvas();
            canvas.renderAll();
            console.log('Canvas initialized and rendered');
        }, 300);

// Replace the showGameIframe function (around line 560) with this corrected version:
function showGameIframe() {
    console.log('showGameIframe called for slide:', currentSlide);
    console.log('Current slide data:', slides[currentSlide]);
    
    const wrapper = document.querySelector('.canvas-wrapper');
    let existing = document.getElementById('game-iframe');
    
    // Remove if not on a game slide
    if (!slides[currentSlide] || !slides[currentSlide].game) {
        console.log('No game on current slide, removing iframe');
        if (existing) existing.remove();
        return;
    }
    
    console.log('Game found on slide, creating/updating iframe');
    
    // Show if on a game slide
    if (!existing) {
        console.log('Creating new iframe');
        
        const iframe = document.createElement('iframe');
        iframe.id = 'game-iframe';
        
        // Add edit mode parameter to game URL for quiz-specific editing
        let gameUrl = slides[currentSlide].game.url;
        const separator = gameUrl.includes('?') ? '&' : '?';
        const quizId = getQuizId();
        gameUrl += separator + `edit=true&mode=quiz&quizId=${encodeURIComponent(quizId)}`;
        
        console.log('Game URL:', gameUrl);
        
        iframe.src = gameUrl;
        iframe.style.cssText = `
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            z-index: 10 !important;
            max-width: 100% !important;
            max-height: 100% !important;
            overflow: hidden !important;
            object-fit: cover !important;
            border-radius: 0 !important;
            background: white !important;
        `;
        iframe.scrolling = 'no';
        iframe.allow = 'fullscreen';

        // Listen for game data updates from iframe
        if (!window.gameMessageListenerAdded) {
            window.addEventListener('message', handleGameMessage, false);
            window.gameMessageListenerAdded = true;
        }

        // Ensure wrapper is properly configured
        wrapper.style.position = 'relative';
        wrapper.style.overflow = 'hidden';
        
        // Hide canvas when game is active
        const canvas = document.getElementById('canvas');
        if (canvas) {
            canvas.style.display = 'none';
        }
        
        wrapper.appendChild(iframe);
        
        console.log('Iframe created and added to wrapper');
        
        // FIXED: Load existing game data if available with better timing
        iframe.onload = function() {
            console.log('Iframe loaded, checking for existing game data');
            
            // Give the game time to initialize
            setTimeout(() => {
                if (slides[currentSlide].game.data) {
                    console.log('Sending existing game data to iframe:', slides[currentSlide].game.data);
                    
                    // Parse game data if it's a string
                    let gameData = slides[currentSlide].game.data;
                    if (typeof gameData === 'string') {
                        try {
                            gameData = JSON.parse(gameData);
                        } catch (e) {
                            console.error('Error parsing game data:', e);
                        }
                    }
                    
                    iframe.contentWindow.postMessage({
                        type: 'loadQuizGameData',
                        gameData: gameData,
                        quizId: getQuizId(),
                        isEditMode: true
                    }, '*');
                } else {
                    console.log('No existing game data found');
                    // Send request for game to load in edit mode
                    iframe.contentWindow.postMessage({
                        type: 'requestQuizGameData',
                        quizId: getQuizId()
                    }, '*');
                }
            }, 1000); // Increased delay to ensure game is fully loaded
        };
    } else {
        console.log('Updating existing iframe');
        
        // Update existing iframe with edit parameters
        let gameUrl = slides[currentSlide].game.url;
        const separator = gameUrl.includes('?') ? '&' : '?';
        const quizId = getQuizId();
        gameUrl += separator + `edit=true&mode=quiz&quizId=${encodeURIComponent(quizId)}`;
        
        existing.src = gameUrl;
        existing.style.display = 'block';
        
        // Hide canvas when game is active
        const canvas = document.getElementById('canvas');
        if (canvas) {
            canvas.style.display = 'none';
        }
        
        // Send existing game data after a delay
        setTimeout(() => {
            if (slides[currentSlide].game.data) {
                let gameData = slides[currentSlide].game.data;
                if (typeof gameData === 'string') {
                    try {
                        gameData = JSON.parse(gameData);
                    } catch (e) {
                        console.error('Error parsing game data:', e);
                    }
                }
                
                existing.contentWindow.postMessage({
                    type: 'loadQuizGameData',
                    gameData: gameData,
                    quizId: getQuizId(),
                    isEditMode: true
                }, '*');
            }
        }, 500);
    }
}
        
// FIXED: Enhanced message handler to properly capture and save game data
function handleGameMessage(event) {
    console.log('📨 Quiz Editor received message:', event.data);
    
    const data = event.data;
    
    if (data.type === 'saveQuizGameData' || data.type === 'gameDataUpdate') {
        console.log('💾 SAVING quiz-specific game data:', data.gameData);
        
        // Update the current slide's game data
        if (slides[currentSlide] && slides[currentSlide].game) {
            // CRITICAL: Store the ACTUAL game data (values, questions, etc.)
            slides[currentSlide].game.data = data.gameData;
            slides[currentSlide].game.lastModified = new Date().toISOString();
            slides[currentSlide].game.quizId = getQuizId();
            slides[currentSlide].game.isQuizSpecific = true;
            slides[currentSlide].game.customized = true;
            
            console.log('✅ Game data saved to slide:', {
                slideIndex: currentSlide,
                hasData: !!slides[currentSlide].game.data,
                dataPreview: typeof slides[currentSlide].game.data === 'object' ? 
                            JSON.stringify(slides[currentSlide].game.data).substring(0, 100) + '...' :
                            slides[currentSlide].game.data
            });
            
            // Force immediate save to ensure data persistence
            saveCurrentSlide();
            triggerImmediateAutoSave();
            showAutoSaveIndicator('🎮 Game edits saved!');
        }
    } else if (data.type === 'requestQuizGameData') {
        console.log('🔄 Game requesting existing data for slide:', currentSlide);
        
        const iframe = document.getElementById('game-iframe');
        if (iframe && slides[currentSlide] && slides[currentSlide].game) {
            let gameData = slides[currentSlide].game.data;
            
            // Don't parse if it's already an object
            if (typeof gameData === 'string' && gameData) {
                try {
                    gameData = JSON.parse(gameData);
                } catch (e) {
                    console.error('Error parsing game data:', e);
                    gameData = null;
                }
            }
            
            console.log('📤 Sending existing data to game:', gameData);
            
            iframe.contentWindow.postMessage({
                type: 'loadQuizGameData',
                gameData: gameData,
                quizId: getQuizId(),
                isEditMode: true
            }, '*');
        } else {
            console.log('❌ No existing game data found');
            
            // Send empty data to let game know it can start fresh
            iframe.contentWindow.postMessage({
                type: 'loadQuizGameData',
                gameData: null,
                quizId: getQuizId(),
                isEditMode: true
            }, '*');
        }
    } else if (data.type === 'currentGameData') {
        // Handle response from requestCurrentGameData
        console.log('📥 Received current game data from game:', data.gameData);
        
        if (slides[currentSlide] && slides[currentSlide].game) {
            slides[currentSlide].game.data = data.gameData;
            slides[currentSlide].game.lastModified = new Date().toISOString();
            slides[currentSlide].game.customized = true;
            
            console.log('✅ Current game state captured and saved');
            
            saveCurrentSlide();
            triggerImmediateAutoSave();
            showAutoSaveIndicator('🎮 Current game state saved');
        }
    }
}


        // Generate unique quiz ID for this editing session
        function getQuizId() {
            const subject = getParam('subject') || 'general';
            const quarter = getParam('quarter') || 'auto';
            const name = getParam('name') || 'untitled';
            const user = firebase.auth().currentUser;
            const userId = user ? user.uid : 'anonymous';
            
            return `${userId}_${subject}_${quarter}_${name}`;
        }

                    }

        let existingDescription = lastDescription || '';
        try {
            const existingQuizSnap = await db.ref('teachers/' + teacherUID + '/sections/' + section + '/quizzes/' + subject + '/' + quarter + '/' + name).once('value');

            parts: quizParts
        };

        await db.ref('teachers/' + teacherUID + '/sections/' + section + '/quizzes/' + subject + '/' + quarter + '/' + name).set(teacherAutoSaveData);

        lastCanvasState = currentCanvasState;
        showAutoSaveIndicator('Auto-saved under current title');

        // --- START: student auto-save (use teacherAutoSaveData) ---
        try {
            const studentsSnap = await db.ref('students').once('value');
            const studentUpdatePromises = [];

            if (studentsSnap.exists()) {
                studentsSnap.forEach(studentSnap => {

                    const studentUID = studentSnap.key;

                    const studentSection = (student.section || '').toString().trim().toLowerCase();
                    const teacherSectionLower = (section || '').toString().trim().toLowerCase();
                    const studentGrade = (student.gradelevel || '').toString().trim();

function setupCanvasAutoSave() {

    canvas.on('object:rotating', debounce(triggerImmediateAutoSave, 2000));
    canvas.on('text:changed', debounce(triggerImmediateAutoSave, 1000));
    
    // Background changes
    canvas.on('after:render', debounce(triggerImmediateAutoSave, 3000));
    
    // Selection changes (less frequent)
    canvas.on('selection:created', debounce(triggerImmediateAutoSave, 5000));
    canvas.on('selection:updated', debounce(triggerImmediateAutoSave, 5000));
    canvas.on('selection:cleared', debounce(triggerImmediateAutoSave, 5000));
}

// Debounce utility function to prevent excessive auto-saves
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

                // Normalize each slide: ensure game.data is parsed (object) if stored as string
                loadedSlides = loadedSlides.map(s => {
                    const slide = Object.assign({}, s);
                    if (slide.game) {
                        // keep url/type etc, parse data if string
                        if (typeof slide.game.data === 'string' && slide.game.data) {
                            try { slide.game.data = JSON.parse(slide.game.data); }
                            catch (e) { /* keep string if parse fails */ }
                        }
                    }
                    return slide;
                });

            // Add blank slides if fewer than tests
            while (slides.length < targetCount) {
                slides.push(canvas.toJSON());
            }

            // Attach test metadata and optional game info from quizTests to each slide
            for (let i = 0; i < targetCount; i++) {
                const test = (quizTests && quizTests[i]) ? quizTests[i] : {};
                const slide = slides[i] || canvas.toJSON();

                // Keep existing testName/testType if present, else set from test
                slide.testName = slide.testName || test.name || `Test ${i + 1}`;
                slide.testType = slide.testType || test.type || '';

                // If test includes a gameUrl or gameData, attach it but preserve existing slide.game.data
                if (test.gameUrl || test.gameData) {
                    slide.game = slide.game || {};
                    slide.game.url = slide.game.url || test.gameUrl || null;
                    slide.game.type = slide.game.type || test.gameType || (slide.game.url ? getGameType(slide.game.url) : null);
                    slide.game.quizId = slide.game.quizId || getQuizId();
                    if (!slide.game.data && test.gameData) {
                        slide.game.data = (typeof test.gameData === 'string') ? tryParse(test.gameData) : test.gameData;
                    }
                    slide.game.isQuizSpecific = true;

                try { return JSON.parse(v); } catch (e) { return v; }
            }
        })();

        // render sidebar / previews and load first slide

        renderSlidePreviews();
        loadSlide(currentSlide || 0);

    indicator.style.background = isError ? '#e74c3c' : 'var(--primary)';
    indicator.style.opacity = '1';
    indicator.style.transform = 'translateY(0) translateX(0)';
    
    // Fade out after 4 seconds
    setTimeout(() => {
        indicator.style.opacity = '0';
        indicator.style.transform = 'translateY(-20px) translateX(10px)';
    }, 4000);
}
</script>

<script>
    // Add this enhanced function to properly handle quiz-specific game data saving
function saveQuizSpecificGameData() {
    // Get the current game iframe if it exists
    const gameIframe = document.getElementById('game-iframe');
    if (!gameIframe || !slides[currentSlide] || !slides[currentSlide].game) {
        return;
    }

    // Request current game data from the iframe
    gameIframe.contentWindow.postMessage({
        type: 'requestCurrentGameData',
        quizId: getQuizId()
    }, '*');
}

// Enhanced message handler to properly capture and save game data
function handleGameMessage(event) {
    console.log('📨 Quiz Editor received message:', event.data);
    
    const data = event.data;
    
    // Handle when game sends updated data (when user edits questions)
    if (data.type === 'saveQuizGameData' || data.type === 'gameDataUpdate') {
        console.log('💾 SAVING game data from iframe:', data.gameData);
        
        // Update the current slide's game data
        if (slides[currentSlide] && slides[currentSlide].game) {
            // Store the complete game data
            slides[currentSlide].game.data = JSON.stringify(data.gameData);
            slides[currentSlide].game.lastModified = new Date().toISOString();
            slides[currentSlide].game.quizId = getQuizId();
            slides[currentSlide].game.isQuizSpecific = true;
            slides[currentSlide].game.customized = true;
            slides[currentSlide].game.hasEditedQuestions = true;
            
            console.log('✅ Game data saved to canvas slide');
            
            // Force immediate save to ensure data persistence
            saveCurrentSlide();
            triggerImmediateAutoSave();
            showAutoSaveIndicator('🎮 Game questions updated!');
        }
    }
    
    // Handle when game requests existing data (on load)
    else if (data.type === 'requestQuizGameData') {
        console.log('🔄 Game requesting existing quiz data');
        
        const iframe = document.getElementById('game-iframe');
        if (iframe && slides[currentSlide] && slides[currentSlide].game && slides[currentSlide].game.data) {
            let gameData = slides[currentSlide].game.data;
            
            // Parse if it's a string
            if (typeof gameData === 'string') {
                try {
                    gameData = JSON.parse(gameData);
                } catch (e) {
                    console.error('Error parsing stored game data:', e);
                    gameData = null;
                }
            }
            
            console.log('📤 Sending existing game data to iframe:', gameData);
            
            iframe.contentWindow.postMessage({
                type: 'loadQuizGameData',
                gameData: gameData,
                quizId: getQuizId(),
                isEditMode: true
            }, '*');
        } else {
            console.log('❌ No existing game data, sending null');
            iframe.contentWindow.postMessage({
                type: 'loadQuizGameData',
                gameData: null,
                quizId: getQuizId(),
                isEditMode: true
            }, '*');
        }
    }
    
    // Handle response when we request current game data
    else if (data.type === 'currentGameData') {
        console.log('📥 Received current game data from iframe:', data.gameData);
        
        if (slides[currentSlide] && slides[currentSlide].game) {
            // Store the current game state
            slides[currentSlide].game.data = JSON.stringify(data.gameData);
            slides[currentSlide].game.lastModified = new Date().toISOString();
            slides[currentSlide].game.customized = true;
            
            console.log('✅ Current game state captured and saved');
            
            saveCurrentSlide();
            triggerImmediateAutoSave();
            showAutoSaveIndicator('🎮 Current game state saved');
        }
    }
}

// FIXED: Enhanced save function that properly captures and saves game data
document.getElementById('save-btn').onclick = async function() {
    console.log('💾 SAVE CLICKED - Capturing all game data...');
    
    const saveBtn = this;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '⏳ Saving...';
    
    try {
        // STEP 1: If there's an active game, request its current data first
        const gameIframe = document.getElementById('game-iframe');
        if (gameIframe && slides[currentSlide] && slides[currentSlide].game) {
            console.log('📨 Requesting final game state before save...');
            
            // Request current game state and wait for response
            await new Promise((resolve) => {
                let responseReceived = false;
                
                const messageHandler = (event) => {
                    if (!responseReceived && 
                        (event.data.type === 'saveQuizGameData' || 
                         event.data.type === 'currentGameData')) {
                        console.log('✅ Received final game data:', event.data.gameData);
                        
                        // Update the slide with the latest data
                        if (slides[currentSlide] && slides[currentSlide].game) {
                            slides[currentSlide].game.data = JSON.stringify(event.data.gameData);
                            slides[currentSlide].game.lastModified = new Date().toISOString();
                            slides[currentSlide].game.customized = true;
                        }
                        
                        responseReceived = true;
                        window.removeEventListener('message', messageHandler);
                        resolve();
                    }
                };
                
                window.addEventListener('message', messageHandler);
                
                // Request the data
                gameIframe.contentWindow.postMessage({
                    type: 'requestCurrentGameData',
                    quizId: getQuizId(),
                    finalSave: true
                }, '*');
                
                // Timeout after 3 seconds
                setTimeout(() => {
                    if (!responseReceived) {
                        console.log('⏰ Timeout waiting for game data, proceeding with save');
                        window.removeEventListener('message', messageHandler);
                        resolve();
                    }
                }, 3000);
            });
        }
        
        // Continue with existing save logic...
        let quarter = getParam('quarter');
        let name = getParam('name');
        let subject = getParam('subject');
        
        if (!name) {
            name = prompt('Enter a Name for this quiz:', 'MyQuiz');
            if (!name) return;
            name = name.trim();
            if (!name) return alert('Name cannot be empty.');
        }
        
        if (!subject) {
            subject = prompt('Enter subject:', 'subject_math');
            if (!subject) return alert('Subject is required.');
            subject = subject.trim();
        }

        let description = prompt('Enter quiz description (optional):', lastDescription || '');
        if (description === null) return;
        description = description.trim();
        lastDescription = description;

        // Save current slide with all captured data
        saveCurrentSlide();
        
        // Process slides ensuring game data is properly serialized
        const processedSlides = slides.map((slide, index) => {
            if (slide.game && slide.game.data) {
                return {
                    ...slide,
                    game: {
                        ...slide.game,
                        data: typeof slide.game.data === 'string' ? slide.game.data : JSON.stringify(slide.game.data),
                        savedAt: new Date().toISOString(),
                        isQuizSpecific: true,
                        customized: true
                    }
                };
            }
            return slide;
        });
        
        const slidesJson = JSON.stringify(processedSlides);

        // Continue with Firebase save
        const user = firebase.auth().currentUser;
        if (!user) {
            alert('Please log in to save quiz.');
            return;
        }

        const teacherUID = user.uid;
        const teacherSnap = await db.ref('teachers/' + teacherUID).once('value'); 
        const teacher = teacherSnap.val();
        
        if (!teacher || !teacher.section || !teacher.gradelevel) {
            alert('Your section and grade level must be set. Please update your profile.');
            return;
        }
        
        const section = teacher.section;
        const gradeLevel = teacher.gradelevel;
        const teacherName = `${teacher.firstname || ''} ${teacher.lastname || ''}`.trim();
        const quizPassword = Math.floor(100000 + Math.random() * 900000).toString();
        const now = new Date().toISOString();

        const teacherQuizData = {
            slides: slidesJson,
            savedAt: now,
            title: name,
            quarter: quarter,
            description: description,
            subject: subject,
            section: section,
            gradeLevel: gradeLevel,
            createdBy: teacherUID,
            teacherName: teacherName,
            password: quizPassword,
            isLocked: true,
            hasPassword: true,
            hasCustomGames: processedSlides.some(slide => slide.game && slide.game.data),
            gameCount: processedSlides.filter(slide => slide.game).length,
            customGameCount: processedSlides.filter(slide => slide.game && slide.game.data).length,
            quizId: getQuizId(),
            tests: quizTests
        };

        // Save to teacher's collection
        await db.ref('teachers/' + teacherUID + '/sections/' + section + '/quizzes/' + subject + '/' + quarter + '/' + name).set(teacherQuizData);

        // --- START: update all students in the same section and grade using teacherQuizData ---
        const studentsSnap = await db.ref('students').once('value');
        const studentUpdatePromises = [];
        let studentsUpdated = 0;

        if (studentsSnap.exists()) {
            studentsSnap.forEach(studentSnap => {
                const student = studentSnap.val();
                const studentUID = studentSnap.key;
                const studentSection = (student.section || '').toString().trim().toLowerCase();
                const teacherSectionLower = (section || '').toString().trim().toLowerCase();
                const studentGrade = (student.gradelevel || '').toString().trim();
                const teacherGrade = (gradeLevel || '').toString().trim();

                if (studentSection === teacherSectionLower && studentGrade === teacherGrade) {
                    studentsUpdated++;

                    const studentQuizData = {
                        ...teacherQuizData,
                        assignedBy: teacherUID,
                        assignedAt: now,
                        status: 'available',
                        attempts: 0,
                        bestScore: 0,
                        lastAttemptAt: null,
                        studentUID: studentUID
                    };

                    studentUpdatePromises.push(
                        db.ref(`students/${studentUID}/quizzes/${subject}/${quarter}/${name}`).set(studentQuizData)
                    );
                }
            });

            await Promise.all(studentUpdatePromises);
        }
        // --- END: update students ---

        const customGamesCount = teacherQuizData.customGameCount;
        const successMessage = `✅ Quiz saved successfully!\n\n` +
            `📝 Quiz: "${name}"\n` +
            `🔐 Password: ${quizPassword}\n` +
            `🎮 Customized games: ${customGamesCount}\n` +
            `👥 Students updated: ${studentsUpdated}\n\n` +
            `Your edited questions will now appear when students take the quiz!`;
        
        alert(successMessage);
        
    } catch (error) {
        console.error('❌ Save error:', error);
        alert('Error saving quiz: ' + error.message);
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa fa-save"></i> Save';
    }
};

// Rightbar Controls - Position, Text, Layers, Undo/Redo
// Position controls
document.querySelector('.position-btns').onclick = function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const obj = canvas.getActiveObject();
    if (!obj) return;
    switch(btn.title) {
        case 'Align Left': obj.set({ left: 0 }); break;
        case 'Align Center': obj.set({ left: (canvas.width - obj.getScaledWidth())/2 }); break;
        case 'Align Right': obj.set({ left: canvas.width - obj.getScaledWidth() }); break;
        case 'Align Top': obj.set({ top: 0 }); break;
        case 'Align Middle': obj.set({ top: (canvas.height - obj.getScaledHeight())/2 }); break;
        case 'Align Bottom': obj.set({ top: canvas.height - obj.getScaledHeight() }); break;
    }
    canvas.renderAll();
    triggerImmediateAutoSave();
};

// Layer controls
document.querySelector('.layer-btns').onclick = function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const activeObjects = canvas.getActiveObjects();
    if (!activeObjects || activeObjects.length === 0) return;
    switch(btn.title) {
        case 'Bring Forward':
            canvas.bringForward(activeObjects[activeObjects.length - 1]);
            break;
        case 'Send Backward':
            canvas.sendBackwards(activeObjects[0]);
            break;
        case 'Delete':
            activeObjects.forEach(obj => canvas.remove(obj));
            break;
    }
    canvas.discardActiveObject();
    const remaining = canvas.getObjects().filter(obj => activeObjects.includes(obj));
    if (remaining.length > 0) {
        canvas.setActiveObject(remaining[0]);
    }
    canvas.renderAll();
    triggerImmediateAutoSave();
};

// Color pickers
const colorInput = document.querySelector('.color-input');
const shapeColorInput = document.querySelector('.shape-color-input');

// Show/hide color pickers based on selection
function updateColorPickers() {
    const active = canvas.getActiveObject();
    const activeGroup = canvas.getActiveObjects && canvas.getActiveObjects();
    if (!colorInput || !shapeColorInput) return;
    
    colorInput.style.display = 'none';
    shapeColorInput.style.display = 'none';
    
    // Multi-selection
    if (activeGroup && activeGroup.length > 1) {
        let allText = activeGroup.every(obj => obj.type === 'i-text');
        let allShapes = activeGroup.every(obj => ['rect','circle','polygon','triangle','ellipse'].includes(obj.type));
        let allLines = activeGroup.every(obj => obj.type === 'line');
        
        if (allText) {
            colorInput.style.display = '';
            let hex = activeGroup[0].fill ? fabric.Color.fromSource(fabric.Color.sourceFromHex(activeGroup[0].fill)).toHex() : '#232946';
            colorInput.value = hex;
        } else if (allShapes || allLines) {
            shapeColorInput.style.display = '';
            let hex = allShapes ? (activeGroup[0].fill ? fabric.Color.fromSource(fabric.Color.sourceFromHex(activeGroup[0].fill)).toHex() : '#b39ddb') : (activeGroup[0].stroke || '#b39ddb');
            shapeColorInput.value = hex;
        }
        return;
    }
    
    if (active) {
        if (active.type === 'i-text') {
            colorInput.style.display = '';
            let hex = active.fill ? fabric.Color.fromSource(fabric.Color.sourceFromHex(active.fill)).toHex() : '#232946';
            colorInput.value = hex;
        } else if (['rect','circle','polygon','triangle','ellipse'].includes(active.type)) {
            shapeColorInput.style.display = '';
            let hex = active.fill ? fabric.Color.fromSource(fabric.Color.sourceFromHex(active.fill)).toHex() : '#b39ddb';
            shapeColorInput.value = hex;
        } else if (active.type === 'line') {
            shapeColorInput.style.display = '';
            let hex = active.stroke || '#b39ddb';
            try { hex = fabric.Color.fromSource(fabric.Color.sourceFromHex(hex)).toHex(); } catch(e){}
            shapeColorInput.value = hex;
        }
    }
}

canvas.on('selection:created', updateColorPickers);
canvas.on('selection:updated', updateColorPickers);
canvas.on('selection:cleared', updateColorPickers);
canvas.on('object:modified', updateColorPickers);

            obj.set({ fill: this.value });
            canvas.renderAll();
            triggerImmediateAutoSave();

// Shape color input
if (shapeColorInput) {
    shapeColorInput.addEventListener('input', function() {
        const activeGroup = canvas.getActiveObjects && canvas.getActiveObjects();
        if (activeGroup && activeGroup.length > 1) {
            activeGroup.forEach(obj => {
                if (['rect','circle','polygon','triangle','ellipse'].includes(obj.type)) {
                    obj.set({ fill: this.value });
                } else if (obj.type === 'line') {
                    obj.set({ stroke: this.value });
                }
            });
            canvas.renderAll();
            triggerImmediateAutoSave();
            return;
        }
        const obj = canvas.getActiveObject();
        if (obj) {
            if (['rect','circle','polygon','triangle','ellipse'].includes(obj.type)) {
                obj.set({ fill: this.value });
            } else if (obj.type === 'line') {
                obj.set({ stroke: this.value });
            }
            canvas.renderAll();
            triggerImmediateAutoSave();
        }
    });
}

// Undo/Redo
let undoState = [], undoMods = 0;
function saveUndoState() {
    undoMods = 0;
    undoState.push(JSON.stringify(canvas));
    // Limit undo history to 50 states
    if (undoState.length > 50) undoState.shift();
}

canvas.on('object:added', saveUndoState);
canvas.on('object:modified', saveUndoState);
canvas.on('object:removed', saveUndoState);

if (document.getElementById('undo-btn')) {
    document.getElementById('undo-btn').onclick = function() {
        if (undoState.length > 1) {
            undoState.pop();
            canvas.loadFromJSON(undoState[undoState.length-1], function() {
                canvas.renderAll();
            });
        }
    };
}

if (document.getElementById('redo-btn')) {
    document.getElementById('redo-btn').onclick = function() {
        alert('Redo not implemented yet.');
    };
}
