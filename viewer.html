<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Viewer - Edutaktika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            color: #1976d2;
            font-size: 1.8em;
            font-weight: 600;
        }

        .back-button {
            padding: 12px 24px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.3s;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background: #1565c0;
        }

        .viewer-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 600px;
        }

        #polotno-container {
            width: 100%;
            height: calc(100vh - 180px);
            min-height: 500px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            color: #666;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e3f2fd;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 30px;
            border-radius: 10px;
            margin: 40px 20px;
            text-align: center;
        }

        .error h2 {
            margin-bottom: 15px;
        }

        .error p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .toolbar {
            background: #f5f5f5;
            padding: 15px 20px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-info {
            color: #666;
            font-size: 0.9em;
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
        }

        .toolbar-button {
            padding: 8px 16px;
            background: white;
            border: 2px solid #1976d2;
            color: #1976d2;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .toolbar-button:hover {
            background: #1976d2;
            color: white;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .header-title {
                font-size: 1.4em;
            }

            #polotno-container {
                height: calc(100vh - 220px);
            }

            .toolbar {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">🎨 Design Viewer</div>
            <a href="gallery.html" class="back-button">
                ← Back to Gallery
            </a>
        </header>

        <div class="viewer-container">
            <div class="toolbar">
                <div class="toolbar-info">
                    <strong>Mode:</strong> Read-only view
                </div>
                <div class="toolbar-actions">
                    <button class="toolbar-button" onclick="zoomIn()">🔍 Zoom In</button>
                    <button class="toolbar-button" onclick="zoomOut()">🔍 Zoom Out</button>
                    <button class="toolbar-button" onclick="fitToScreen()">📐 Fit to Screen</button>
                </div>
            </div>
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <p style="font-size: 1.2em; font-weight: 500;">Loading design...</p>
                <p style="font-size: 0.9em; color: #999; margin-top: 10px;">Please wait while we fetch your design</p>
            </div>
            <div id="polotno-container" style="display: none;"></div>
        </div>
    </div>

    <!-- Polotno CDN -->
    <script src="https://unpkg.com/polotno@latest/polotno.bundle.js"></script>

    <script>
        let store = null;

        async function loadDesign() {
            const urlParams = new URLSearchParams(window.location.search);
            const designUrl = urlParams.get('design');

            if (!designUrl) {
                showError('No design URL provided', 'Please return to the gallery and select a design to view.');
                return;
            }

            try {
                // Fetch the design JSON from Firebase Storage
                const response = await fetch(designUrl);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch design (HTTP ${response.status})`);
                }

                const designJson = await response.json();

                // Initialize Polotno
                const { createStore } = window.polotno;
                store = createStore({
                    key: 'nFA5H9elEytDyPyvKL7T', // Free tier key
                    showCredit: true
                });

                // Load the design into the store
                store.loadJSON(designJson);

                // Create Polotno instance
                const container = document.getElementById('polotno-container');
                const { Workspace } = window.polotno;
                
                const workspace = new Workspace({
                    store,
                    container,
                    // Make it read-only
                    components: {
                        Toolbar: () => null, // Hide default toolbar
                        SidePanel: () => null, // Hide side panel
                        ZoomButtons: () => null // Hide zoom buttons
                    }
                });

                // Hide loading and show the viewer
                document.getElementById('loading').style.display = 'none';
                container.style.display = 'block';

                // Fit to screen after a short delay
                setTimeout(() => {
                    fitToScreen();
                }, 100);

            } catch (error) {
                console.error('Error loading design:', error);
                showError(
                    'Failed to load design',
                    error.message + '\n\nPlease check that the design URL is correct and accessible.'
                );
            }
        }

        function showError(title, message) {
            const loading = document.getElementById('loading');
            loading.innerHTML = `
                <div class="error">
                    <h2>⚠️ ${title}</h2>
                    <p>${message}</p>
                    <a href="gallery.html" class="back-button">← Back to Gallery</a>
                </div>
            `;
        }

        function zoomIn() {
            if (store) {
                const currentScale = store.scale || 1;
                store.setScale(currentScale * 1.2);
            }
        }

        function zoomOut() {
            if (store) {
                const currentScale = store.scale || 1;
                store.setScale(currentScale * 0.8);
            }
        }

        function fitToScreen() {
            if (store) {
                const container = document.getElementById('polotno-container');
                const page = store.pages[store.selectedPage || 0];
                
                if (page) {
                    const containerWidth = container.clientWidth;
                    const containerHeight = container.clientHeight;
                    const pageWidth = page.width;
                    const pageHeight = page.height;
                    
                    const scaleX = (containerWidth * 0.9) / pageWidth;
                    const scaleY = (containerHeight * 0.9) / pageHeight;
                    const scale = Math.min(scaleX, scaleY);
                    
                    store.setScale(scale);
                }
            }
        }

        // Load design on page load
        window.addEventListener('DOMContentLoaded', loadDesign);

        // Handle window resize
        window.addEventListener('resize', () => {
            if (store) {
                fitToScreen();
            }
        });
    </script>
</body>
</html>
