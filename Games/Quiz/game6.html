<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Card Match Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
html, body {
  height: 100vh;
  margin: 0;
  padding: 0;
  width: 100vw;
  box-sizing: border-box;
  display: flex;
  align-items: center;      /* Center vertically */
  justify-content: center;  /* Center horizontally */
  background: #f7f9fc;
  overflow-x: hidden;
}
    .game-container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px #0002;
      padding: 32px 24px;
      width: 90vw;
      text-align: center;
      position: relative;
    }
    .edit-button {
      position: absolute;
      top: 1em;
      right: 1em;
      background: #198754;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5em 1.2em;
      font-size: 1em;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 8px #0001;
      z-index: 10;
    }
    .edit-button[hidden] { display: none; }
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 24px #0003;
      padding: 2em 2em 1em 2em;
      text-align: center;
      min-width: 320px;
      max-width: 95vw;
    }
    .modal-header {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 1em;
    }
    .close-btn {
      position: absolute;
      top: 1em;
      right: 1em;
      background: none;
      border: none;
      font-size: 1.5em;
      color: #888;
      cursor: pointer;
    }
    .completion-modal {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
    }
    .completion-modal.show { display: flex; }
    .completion-content {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 24px #0003;
      padding: 2em 2em 1em 2em;
      text-align: center;
      min-width: 320px;
      max-width: 95vw;
      font-size: 1.2em;
      color: #198754;
      font-weight: 600;
    }
    .btn {
      background: #198754;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7em 2em;
      font-size: 1em;
      font-weight: 600;
      box-shadow: 0 2px 8px #0001;
      cursor: pointer;
      margin-top: 1em;
    }
    .memory-board {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 12px;
      width: min(90vw, 420px);
      margin: 2em auto 1em auto;
      justify-items: center;
      align-items: center;
    }
    .memory-card {
      width: 70px;
      height: 90px;
      background: transparent;
      border: none;
      box-shadow: none;
      perspective: 600px;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }
    .memory-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .memory-card.flipped .memory-card-inner,
    .memory-card.matched .memory-card-inner {
      transform: rotateY(180deg);
    }
    .memory-card-front, .memory-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
      font-weight: 600;
      user-select: none;
      box-shadow: 0 2px 8px #0001;
      background: #e9ecef;
      color: #198754;
      transition: background 0.2s, color 0.2s;
    }
    .memory-card-front {
      background: #e9ecef;
      color: #198754;
      cursor: pointer;
    }
    .memory-card-back {
      background: #4f8cff;
      color: #fff;
      transform: rotateY(180deg);
      cursor: default;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .memory-card.matched .memory-card-back {
      background: #27ae60;
      opacity: 0.7;
    }
    .memory-card img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 6px;
      box-shadow: 0 1px 4px #0002;
      background: #fff;
    }
    .memory-card:active .memory-card-inner {
      transform: scale(1.07);
    }
    @media (max-width: 700px) {
      .memory-board {
        width: min(98vw, 340px);
        gap: 8px;
      }
      .memory-card {
        width: 54px;
        height: 70px;
        font-size: 1.1em;
      }
    }
    @media (max-width: 500px) {
      .memory-board {
        width: min(99vw, 260px);
        gap: 6px;
      }
      .memory-card {
        width: 38px;
        height: 48px;
        font-size: 0.9em;
      }
      .modal-content, .completion-content { min-width: 140px; padding: 1em; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <button class="edit-button" id="editBtn" hidden>Edit Game</button>
    <div class="memory-board" id="memoryBoard"></div>
  </div>

  <!-- Editor Modal -->
  <div class="modal" id="editorModal">
    <div class="modal-content">
      <div class="modal-header">Edit Word List</div>
      <button class="close-btn" id="closeEditorBtn">&times;</button>
      <textarea id="wordsInput" rows="6" style="width:100%;margin-bottom:1em;"></textarea>
      <button class="btn" id="saveWordsBtn">Save</button>
      <div id="saveStatus" style="margin-top:0.5em;color:#198754;display:none;">Saved!</div>
    </div>
  </div>

  <!-- Completion Modal -->
  <div class="completion-modal" id="completionModal">
    <div class="completion-content">
      🎉 Congratulations! You matched all the cards!
      <button class="btn" id="doneBtn">Done</button>
    </div>
  </div>

  <script>
    // --- Editable Content State ---
    let words = [
      "APPLE",
      "DOG",
      "HOUSE",
      "MOON",
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=facearea&w=256&q=80", // Example image
      "SUN",
      "TREE",
      "https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=facearea&w=256&q=80"
    ];
    let cards = [];
    let flipped = [];
    let matched = [];
    let lockBoard = false;
    let moves = 0;

    // --- Quiz Editor Detection ---
    const editBtn = document.getElementById('editBtn');
    const isQuizEditor =
      window.location.search.includes('quizEditor') ||
      window.name === 'quizEditor' ||
      (window.parent !== window && window.parent !== null && window.name === 'quizEditor');

    // Hide edit button by default, show only in quizEditor
    if (editBtn) {
      editBtn.hidden = !isQuizEditor;
    }

    // --- Load words for quizEditor preview ---
    if (isQuizEditor) {
      try {
        const saved = localStorage.getItem('quizEditor_game6_words');
        if (saved) {
          const arr = JSON.parse(saved);
          if (Array.isArray(arr) && arr.every(w => typeof w === 'string')) {
            words = arr;
          }
        }
      } catch (e) {}
      startGame();
    } else if (!isQuizEditor && window.parent === window) {
      // Not in quizEditor and not embedded, show default game
      startGame();
    }

    // --- Listen for parent data for students/teachers ---
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'loadQuizGameData' && event.data.gameData?.words) {
        words = event.data.gameData.words;
        startGame();
      }
      if (event.data && event.data.type === 'setTestIndex') {
        parentTestIndex = event.data.index;
      }
    });

    // --- Game Logic ---
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function isImage(word) {
      return /^https?:\/\/.+\.(jpg|jpeg|png|gif)$/i.test(word) || /^https?:\/\/.+unsplash\.com/.test(word);
    }
    function isEmoji(str) {
      // Simple emoji detection
      return /\p{Emoji}/u.test(str);
    }

    function startGame() {
      matched = [];
      flipped = [];
      lockBoard = false;
      moves = 0;
      // Each word appears twice
      cards = shuffle([...words, ...words].map((word, i) => ({
        id: i,
        word,
        matched: false,
        flipped: false
      })));
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('memoryBoard');
      board.innerHTML = '';
      // Set columns so that all cards fit in 2 rows
      const total = cards.length;
      const cols = Math.ceil(total / 2);
      board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      cards.forEach((card, idx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'memory-card' +
          (card.flipped || card.matched ? ' flipped' : '') +
          (card.matched ? ' matched' : '');
        cardDiv.tabIndex = 0;
        cardDiv.setAttribute('aria-label', 'Memory card');
        cardDiv.onclick = () => flipCard(idx);

        // Card inner for flip effect
        const inner = document.createElement('div');
        inner.className = 'memory-card-inner';

        // Card front (hidden side)
        const front = document.createElement('div');
        front.className = 'memory-card-front';
        front.innerHTML = '?';

        // Card back (revealed side)
        const back = document.createElement('div');
        back.className = 'memory-card-back';
        if (isImage(card.word)) {
          const img = document.createElement('img');
          img.src = card.word;
          img.alt = "Card image";
          back.appendChild(img);
        } else if (isEmoji(card.word)) {
          back.innerHTML = `<span style="font-size:2em;">${card.word}</span>`;
        } else {
          back.textContent = card.word;
        }

        inner.appendChild(front);
        inner.appendChild(back);
        cardDiv.appendChild(inner);
        board.appendChild(cardDiv);
      });
    }

    function flipCard(idx) {
      if (lockBoard) return;
      if (cards[idx].flipped || cards[idx].matched) return;
      cards[idx].flipped = true;
      flipped.push(idx);
      renderBoard();
      if (flipped.length === 2) {
        lockBoard = true;
        setTimeout(() => {
          checkMatch();
        }, 700);
      }
    }

    function checkMatch() {
      const [i1, i2] = flipped;
      if (cards[i1].word === cards[i2].word) {
        cards[i1].matched = true;
        cards[i2].matched = true;
        matched.push(i1, i2);
      } else {
        cards[i1].flipped = false;
        cards[i2].flipped = false;
      }
      flipped = [];
      lockBoard = false;
      renderBoard();
      if (matched.length === cards.length) {
        setTimeout(showCompletion, 400);
      }
    }

    function showCompletion() {
      document.getElementById('completionModal').classList.add('show');
    }

    // --- Done button handler: send score to parent ---
    let parentTestIndex = 0;
    document.getElementById('doneBtn').onclick = function() {
      document.getElementById('doneBtn').disabled = true;
      setTimeout(() => {
        document.getElementById('completionModal').classList.remove('show');
      }, 1200);
      window.parent.postMessage({
        type: 'quizResult',
        payload: {
          score: words.length,
          maxScore: words.length,
          answers: words,
          quizId: window.location.pathname.split('/').pop(),
          slideIndex: parentTestIndex
        }
      }, '*');
    };

    // --- Editor Modal Logic ---
    editBtn.onclick = function() {
      document.getElementById('editorModal').classList.add('show');
      document.getElementById('wordsInput').value = words.join('\n');
      document.getElementById('saveStatus').style.display = 'none';
    };
    document.getElementById('closeEditorBtn').onclick = function() {
      document.getElementById('editorModal').classList.remove('show');
    };

    document.getElementById('saveWordsBtn').onclick = function() {
      let newWords = document.getElementById('wordsInput').value
        .split(/[\n,]+/)
        .map(w => w.trim())
        .filter(w => w.length > 1);
      if (newWords.length < 2) {
        alert("Please enter at least two valid words or image URLs (min 2 chars).");
        return;
      }
      words = newWords;
      document.getElementById('editorModal').classList.remove('show');
      // Save to localStorage for preview
      if (isQuizEditor) {
        localStorage.setItem('quizEditor_game6_words', JSON.stringify(newWords));
        // Send edited data to parent/canvas for saving to database
        const quizId = window.location.pathname.split('/').pop();
        const quizGameData = {
          words: newWords,
          lastModified: new Date().toISOString(),
          quizId: quizId,
          gameType: 'memorymatch',
          gameUrl: window.location.href.split('?')[0],
          isCustomized: true,
          totalWords: newWords.length
        };
        window.parent.postMessage({
          type: 'saveQuizGameData',
          gameData: quizGameData,
          quizId: quizId,
          source: 'game-editor'
        }, '*');
        window.parent.postMessage({
          type: 'gameDataUpdate',
          gameData: quizGameData,
          quizId: quizId,
          action: 'immediate-save'
        }, '*');
      }
      startGame();
      document.getElementById('saveStatus').textContent = "Saved!";
      document.getElementById('saveStatus').style.display = '';
      setTimeout(() => { document.getElementById('saveStatus').style.display = 'none'; }, 1200);
    };

    // --- Hide Edit Button for Students/Teachers ---
    (function hideEditButtonForStudents(){
      const params = new URLSearchParams(window.location.search);
      const isEditMode = params.get('edit') === 'true';
      function hideAllEditControls() {
        const selectors = [
          '.edit-button',
          '#quiz-edit-controls',
          '.btn-edit',
          '.edit-btn',
          '#editorModal'
        ].join(',');
        document.querySelectorAll(selectors).forEach(el => {
          if (el) el.style.display = 'none';
        });
      }
      if (!isQuizEditor && !isEditMode) {
        hideAllEditControls();
        const mo = new MutationObserver(hideAllEditControls);
        mo.observe(document.body, { childList: true, subtree: true });
        window._hideEditButtonsObserver = mo;
      }
    })();
  </script>
</body>
</html>
