<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Search Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Base Colors: Blue (Primary), Green (Success), Orange (Accent/Selection), Dark Grey (Text) */
  :root {
    --color-primary: #007bff; /* Blue */
    --color-secondary: #6c757d; /* Grey */
    --color-success: #28a745; /* Green */
    --color-warning: #ffc107; /* Orange/Yellow */
    --color-light: #f8f9fa; /* Off-White */
    --color-dark: #343a40; /* Dark Grey */
    --color-background: #e9eff5; /* Light Blue Background */
  }

  body {
    font-family: 'Poppins', Arial, sans-serif;
    background: var(--color-background);
    margin: 0;
    padding: 0;
    width: 100vw;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-x: hidden;
  }
  
  .game-container {
    width: 100vw;
    max-width: 100vw;
    margin: 0;
    border-radius: 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Added subtle shadow for depth */
    padding: 1em 1em; /* Increased padding slightly */
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  
  .edit-button {
    position: absolute;
    top: 1em;
    right: 1em;
    background: var(--color-primary); /* Primary blue */
    color: #fff;
    border: none;
    border-radius: 12px; /* Softer rounded corners */
    padding: 0.6em 1.5em; /* Slightly bigger button */
    font-size: 1em;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3); /* Blue shadow */
    transition: transform 0.1s, box-shadow 0.1s;
    z-index: 10;
  }
  
  .edit-button:hover {
    background: #0056b3; /* Darker blue on hover */
    transform: translateY(-2px);
    box-shadow: 0 6px 10px rgba(0, 123, 255, 0.4);
  }
  
  .edit-button[hidden] { display: none; }
  
  /* Modal Styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0; top: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); /* Darker overlay */
    align-items: center;
    justify-content: center;
  }
  
  .modal.show { display: flex; }
  
  .modal-content {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2); /* More prominent shadow */
    padding: 2.5em; /* Increased padding */
    text-align: center;
    min-width: 350px;
    max-width: 90vw;
    position: relative;
    animation: fadeIn 0.3s ease-out;
  }

  .modal-header {
    font-size: 1.5em; /* Larger header */
    font-weight: 700;
    color: var(--color-primary);
    margin-bottom: 1em;
  }
  
  .close-btn {
    position: absolute;
    top: 0.7em;
    right: 1em;
    background: none;
    border: none;
    font-size: 2em;
    color: var(--color-secondary);
    cursor: pointer;
    transition: color 0.2s;
  }

  .close-btn:hover {
    color: var(--color-dark);
  }
  
  /* Word List */
  #questionArea {
    font-size: 1.3em;
    font-weight: 700;
    margin: 1.5em 0 1em 0;
    text-align: center;
    color: var(--color-dark); /* Darker text */
    text-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  
  .word-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7em; /* Slightly larger gap */
    margin-top: 1em;
    margin-bottom: 1.5em;
    justify-content: center;
    width: 100%;
  }
  
  .word-item {
    background: var(--color-light);
    border: 1px solid #ddd;
    border-radius: 20px; /* Pill shape */
    padding: 0.5em 1.2em;
    font-weight: 600;
    font-size: 1em;
    color: var(--color-dark);
    margin-bottom: 0.2em;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }
  
  .word-item.found {
    background: var(--color-success); /* Vibrant green */
    color: #fff;
    text-decoration: line-through;
    box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3); /* Green shadow */
    border-color: var(--color-success);
  }

  /* Grid and Cells */
  .grid-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 1em;
  }
  
  .grid {
    width: 90vw;
    max-width: 600px;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px; /* Increased gap */
    background: var(--color-primary); /* Blue background for grid box */
    border-radius: 12px;
    padding: 0.7em;
    user-select: none;
    border: 3px solid var(--color-primary);
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); /* Grid shadow */
  }
  
  .cell {
    font-size: clamp(1.5em, 1.5vw, 1em);
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1 / 1;
    background: var(--color-light); /* Light cell background */
    border-radius: 6px;
    font-weight: 700;
    color: var(--color-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.1s ease-out, color 0.1s ease-out;
    border: 1px solid #e9ecef; /* Lighter border */
    position: relative;
    padding: 0;
    text-transform: uppercase;
  }
  
  .cell:hover:not(.found) {
    background: #f1f3f5; /* Slight hover effect */
  }
  
  .cell.selected {
    background: var(--color-warning); /* Vibrant orange for selection */
    color: var(--color-dark);
    box-shadow: inset 0 0 0 2px var(--color-warning);
  }
  
  .cell.found {
    background: var(--color-success); /* Success green */
    color: #fff;
    /* Optional: pulse animation for found words */
    animation: pulseGlow 1s ease-out infinite alternate;
  }
  
  /* Completion Modal */
  .completion-modal {
    display: none;
    position: fixed;
    z-index: 3000;
    left: 0; top: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  
  .completion-modal.show { display: flex; }
  
  .completion-content {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    padding: 3em; /* More space */
    text-align: center;
    min-width: 320px;
    max-width: 95vw;
    font-size: 1.4em; /* Larger text */
    color: var(--color-success);
    font-weight: 700;
    animation: bounceIn 0.5s ease-out;
  }
  
  /* Buttons */
  .btn {
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0.8em 2.5em;
    font-size: 1.1em;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
    cursor: pointer;
    margin-top: 1.5em;
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  
  .btn:hover {
    background: #0056b3;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 123, 255, 0.4);
  }

  /* Input fields in modal */
  #wordsInput, #questionInput, #distractionInput {
    border: 2px solid var(--color-secondary);
    border-radius: 8px;
    padding: 0.7em;
    font-size: 1.1em;
    color: var(--color-dark);
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }

  #wordsInput:focus, #questionInput:focus, #distractionInput:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
    outline: none;
  }
  
  /* Keyframe Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes bounceIn {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }
  
  @keyframes pulseGlow {
    from { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
    to { box-shadow: 0 0 0 8px rgba(40, 167, 69, 0); }
  }

  /* Media Queries for better responsiveness */
  @media (max-width: 900px) {
    .grid {
      max-width: 70vw; /* Adjusted for tablet landscape */
    }
  }

  @media (max-width: 700px) {
    .grid {
      width: 80vw;
      max-width: 80vw;
    }
  }

  @media (max-width: 600px) {
    .game-container {
      padding: 0.5em;
    }
    .grid {
      width: 90vw;
      max-width: 90vw;
      gap: 2px;
      padding: 0.5em;
    }
    .cell {
      font-size: clamp(1em, 4vw, 1.5em);
      border-radius: 4px;
    }
    .modal-content, .completion-content { 
      min-width: 140px; 
      padding: 1.5em; 
      font-size: 1.2em;
    }
    .edit-button {
      padding: 0.4em 1em;
      font-size: 0.9em;
      border-radius: 8px;
    }
  }
</style>
</head>
<body>
<div class="game-container">
  <button class="edit-button" id="editBtn" hidden>Edit Game</button>
  <div id="questionArea" style="font-size:1.2em;font-weight:600;margin:1em 0 0.5em 0;text-align:center;color:#198754;">
    <!-- The question will appear here -->
  </div>
  <div class="word-list" id="wordList"></div>
  <div class="grid-container">
    <div class="grid" id="grid"></div>
  </div>
  <div style="width:100%;display:flex;justify-content:center;">
    <button class="btn" id="submitBtn" style="margin-top:1em;" disabled>Submit</button>
  </div>
</div>  

  <!-- Editor Modal -->
<div class="modal" id="editorModal">
  <div class="modal-content">
    <div class="modal-header">Edit Word Search</div>
    <button class="close-btn" id="closeEditorBtn">&times;</button>
    <label for="questionInput" style="font-weight:600;display:block;margin-bottom:0.3em;">Question/Prompt:</label>
    <input id="questionInput" type="text" style="width:100%;font-size:1em;padding:0.5em;border-radius:6px;border:1px solid #ccc;margin-bottom:1em;" placeholder="Enter your question here">
    <label for="wordsInput" style="font-weight:600;display:block;margin-bottom:0.3em;">Word List (one per line):</label>
    <textarea id="wordsInput" rows="6" style="width:100%;margin-bottom:1em;"></textarea>
    <label for="distractionInput" style="font-weight:600;display:block;margin-bottom:0.3em;">Distraction Words (one per line):</label>
    <textarea id="distractionInput" rows="4" style="width:100%;margin-bottom:1em;" placeholder="Enter distraction words here"></textarea>
    <button class="btn" id="saveWordsBtn">Save</button>
    <div id="saveStatus" style="margin-top:0.5em;color:#198754;display:none;">Saved!</div>
  </div>
</div>

  <!-- Completion Modal -->
  <div class="completion-modal" id="completionModal">
    <div class="completion-content">
      🎉 Congratulations! You found all the words!
      <button class="btn" id="doneBtn">Done</button>
    </div>
  </div>

  <script>
    // --- Editable Content State ---
    let words = ["APPLE", "DOG", "HOUSE", "MOON", "RIVER", "SUN", "TREE", "WATER", "FISH", "BOOK"];
    let distractionWords = ["CAR", "BIRD", "LION", "CHAIR", "PLANT", "MOUSE", "CLOUD", "FORK"];
    let gridSize = 10;
    let grid = [];
    let foundWords = [];
    let selectedCells = [];
    let selecting = false;
    let startCell = null;
    let score = 0;
    let userSelectedWords = [];

    // --- Directions array MUST be defined before startGame() is called ---
    const directions = [
      { dx: 1, dy: 0 },   // right
      { dx: 0, dy: 1 },   // down
      { dx: 1, dy: 1 },   // down-right
      { dx: -1, dy: 0 },  // left
      { dx: 0, dy: -1 },  // up
      { dx: -1, dy: -1 }, // up-left
      { dx: 1, dy: -1 },  // up-right
      { dx: -1, dy: 1 }   // down-left
    ];

    // --- Quiz Editor Detection ---
    const editBtn = document.getElementById('editBtn');
    const isQuizEditor =
      window.location.search.includes('quizEditor') ||
      window.name === 'quizEditor' ||
      (window.parent !== window && window.parent !== null);

    // Hide edit button by default, show only in quizEditor
    if (editBtn) {
      editBtn.hidden = !isQuizEditor;
    }

    // --- Load words for quizEditor preview ---
    if (isQuizEditor) {
      try {
        const saved = localStorage.getItem('quizEditor_game3_words');
        if (saved) {
          const arr = JSON.parse(saved);
          if (Array.isArray(arr) && arr.every(w => typeof w === 'string')) {
            words = arr;
          }
        }
        const savedDistractions = localStorage.getItem('quizEditor_game3_distractionWords');
        if (savedDistractions) {
          const arr = JSON.parse(savedDistractions);
          if (Array.isArray(arr) && arr.every(w => typeof w === 'string')) {
            distractionWords = arr;
          }
        }
      } catch (e) {}
      startGame();
    } else if (!isQuizEditor && window.parent === window) {
      // Not in quizEditor and not embedded, show default game
      startGame();
    }

    // --- Listen for parent data for students/teachers ---
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'loadQuizGameData' && event.data.gameData?.words) {
        words = event.data.gameData.words;
        gridSize = event.data.gameData.gridSize || 10;
        startGame();
      }
      if (event.data && event.data.type === 'setTestIndex') {
        parentTestIndex = event.data.index;
      }
    });

    // --- Game Logic ---
    function createEmptyGrid() {
      grid = [];
      for (let y = 0; y < gridSize; y++) {
        let row = [];
        for (let x = 0; x < gridSize; x++) {
          row.push({ letter: '', word: null, found: false });
        }
        grid.push(row);
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function placeWords() {
      shuffle(words);
      let placedAny = false;
      // Place correct words
      for (let word of words) {
        let placed = false;
        let tries = 0;
        while (!placed && tries < 100) {
          tries++;
          const dir = directions[Math.floor(Math.random() * directions.length)];
          const x = Math.floor(Math.random() * gridSize);
          const y = Math.floor(Math.random() * gridSize);
          if (canPlace(word, x, y, dir)) {
            for (let i = 0; i < word.length; i++) {
              grid[y + dir.dy * i][x + dir.dx * i].letter = word[i];
              grid[y + dir.dy * i][x + dir.dx * i].word = word;
            }
            placed = true;
            placedAny = true;
          }
        }
      }
      // Place distraction words (but do NOT add to word list)
      for (let word of distractionWords) {
        let placed = false;
        let tries = 0;
        while (!placed && tries < 100) {
          tries++;
          const dir = directions[Math.floor(Math.random() * directions.length)];
          const x = Math.floor(Math.random() * gridSize);
          const y = Math.floor(Math.random() * gridSize);
          if (canPlace(word, x, y, dir)) {
            for (let i = 0; i < word.length; i++) {
              grid[y + dir.dy * i][x + dir.dx * i].letter = word[i];
              // Do NOT set .word property, so they can't be found
            }
            placed = true;
          }
        }
      }
      // Fill empty cells with random letters
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (!grid[y][x].letter) {
            grid[y][x].letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
          }
        }
      }
    }

    function canPlace(word, x, y, dir) {
      for (let i = 0; i < word.length; i++) {
        let nx = x + dir.dx * i;
        let ny = y + dir.dy * i;
        if (nx < 0 || ny < 0 || nx >= gridSize || ny >= gridSize) return false;
        if (grid[ny][nx].letter && grid[ny][nx].letter !== word[i]) return false;
      }
      return true;
    }

    function renderWordList() {
      const wordList = document.getElementById('wordList');
      wordList.innerHTML = '';
      // Show selected words
      userSelectedWords.forEach(word => {
        const item = document.createElement('div');
        item.className = 'word-item found';
        item.textContent = word;
        wordList.appendChild(item);
      });
      // Show how many selections are left
      const left = words.length - userSelectedWords.length;
      const info = document.createElement('div');
      info.style.color = '#888';
      info.style.marginTop = '0.5em';
      info.textContent = `Selections left: ${left}`;
      wordList.appendChild(info);
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = grid[y][x].letter;
          cell.dataset.x = x;
          cell.dataset.y = y;
          if (grid[y][x].found) cell.classList.add('found');
          if (selectedCells.some(c => c.x === x && c.y === y)) cell.classList.add('selected');
          cell.onmousedown = e => startSelect(x, y);
          cell.onmouseenter = e => selecting && extendSelect(x, y);
          cell.onmouseup = e => endSelect(x, y);
          // Touch support
          cell.ontouchstart = e => { startSelect(x, y); };
          cell.ontouchmove = e => {
            const touch = e.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains('cell')) {
              const tx = parseInt(target.dataset.x, 10);
              const ty = parseInt(target.dataset.y, 10);
              extendSelect(tx, ty);
            }
          };
          cell.ontouchend = e => {
            if (selectedCells.length) {
              const last = selectedCells[selectedCells.length - 1];
              endSelect(last.x, last.y);
            }
          };
          gridEl.appendChild(cell);
        }
      }
    }

    function startSelect(x, y) {
      if (grid[y][x].found) return;
      selecting = true;
      selectedCells = [{ x, y }];
      startCell = { x, y };
      renderGrid();
    }

    function extendSelect(x, y) {
      if (!selecting || !startCell) return;
      selectedCells = getLineCells(startCell.x, startCell.y, x, y);
      renderGrid();
    }

    function endSelect(x, y) {
      if (!selecting || !startCell) return;
      selecting = false;
      const cells = getLineCells(startCell.x, startCell.y, x, y);
      const word = cells.map(c => grid[c.y][c.x].letter).join('');
      const reversed = word.split('').reverse().join('');
      let selectedWord = word;
      // Check both directions
      if (
        (!words.includes(word) && !distractionWords.includes(word)) &&
        (!words.includes(reversed) && !distractionWords.includes(reversed))
      ) {
        // Not a valid word, just clear selection
        selectedCells = [];
        startCell = null;
        renderGrid();
        updateSubmitButtonState();
        return;
      }
      // Use the direction that matches a word
      if (
        (words.includes(reversed) || distractionWords.includes(reversed)) &&
        !words.includes(word) && !distractionWords.includes(word)
      ) {
        selectedWord = reversed;
      }
      // Limit selection count
      if (userSelectedWords.length >= words.length) {
        selectedCells = [];
        startCell = null;
        renderGrid();
        updateSubmitButtonState();
        return;
      }
      // Prevent duplicate selection
      if (!userSelectedWords.includes(selectedWord)) {
        userSelectedWords.push(selectedWord);
        // Mark cells as selected
        for (let c of cells) grid[c.y][c.x].found = true;
      }
      selectedCells = [];
      startCell = null;
      renderWordList();
      renderGrid();
      updateSubmitButtonState(); // <-- Add this line
    }

    function getLineCells(x1, y1, x2, y2) {
      let dx = x2 - x1;
      let dy = y2 - y1;
      let len = Math.max(Math.abs(dx), Math.abs(dy));
      if (len === 0) return [{ x: x1, y: y1 }];
      dx = Math.sign(dx);
      dy = Math.sign(dy);
      let cells = [];
      for (let i = 0; i <= len; i++) {
        let x = x1 + dx * i;
        let y = y1 + dy * i;
        if (x >= 0 && y >= 0 && x < gridSize && y < gridSize) {
          cells.push({ x, y });
        }
      }
      return cells;
    }

    function showCompletion() {
      document.getElementById('completionModal').classList.add('show');
    }

    // --- Done button handler: send score to parent ---
    let parentTestIndex = 0;
    document.getElementById('doneBtn').onclick = function() {
      document.getElementById('doneBtn').disabled = true;
      setTimeout(() => {
        document.getElementById('completionModal').classList.remove('show');
      }, 1200);
      window.parent.postMessage({
        type: 'quizResult',
        payload: {
          score: score,
          maxScore: words.length,
          answers: foundWords,
          quizId: window.location.pathname.split('/').pop(),
          slideIndex: parentTestIndex
        }
      }, '*');
    };

    // --- Editor Modal Logic ---
    editBtn.onclick = function() {
      document.getElementById('editorModal').classList.add('show');
      document.getElementById('wordsInput').value = words.join('\n');
      document.getElementById('questionInput').value = questionText;
      document.getElementById('distractionInput').value = distractionWords.join('\n');
      document.getElementById('saveStatus').style.display = 'none';
    };
    document.getElementById('closeEditorBtn').onclick = function() {
      document.getElementById('editorModal').classList.remove('show');
    };

    document.getElementById('saveWordsBtn').onclick = function() {
      let newWords = document.getElementById('wordsInput').value
        .split(/[\n,]+/)
        .map(w => w.trim().toUpperCase())
        .filter(w => w.length > 1 && /^[A-Z]+$/.test(w));
      let newDistractionWords = document.getElementById('distractionInput').value
        .split(/[\n,]+/)
        .map(w => w.trim().toUpperCase())
        .filter(w => w.length > 1 && /^[A-Z]+$/.test(w));
      if (newWords.length === 0) {
        alert("Please enter at least one valid word (letters only, min 2 chars).");
        return;
      }
      if (newWords.some(w => w.length > gridSize) || newDistractionWords.some(w => w.length > gridSize)) {
        alert("All words must fit in the grid. Please use shorter words.");
        return;
      }
      words = newWords;
      distractionWords = newDistractionWords;
      foundWords = [];
      score = 0;
      // Save question
      questionText = document.getElementById('questionInput').value.trim() || "Find all the hidden words!";
      document.getElementById('editorModal').classList.remove('show');
      // Save to localStorage for preview
      if (isQuizEditor) {
        localStorage.setItem('quizEditor_game3_words', JSON.stringify(newWords));
        localStorage.setItem('quizEditor_game3_distractionWords', JSON.stringify(newDistractionWords));
        localStorage.setItem('quizEditor_game3_question', questionText);
        // Send edited data to parent/canvas for saving to database
        const quizId = window.location.pathname.split('/').pop();
        const quizGameData = {
          words: newWords,
          distractionWords: newDistractionWords,
          gridSize: gridSize,
          lastModified: new Date().toISOString(),
          quizId: quizId,
          gameType: 'wordsearch',
          gameUrl: window.location.href.split('?')[0],
          isCustomized: true,
          totalWords: newWords.length,
          question: questionText
        };
        window.parent.postMessage({
          type: 'saveQuizGameData',
          gameData: quizGameData,
          quizId: quizId,
          source: 'game-editor'
        }, '*');
        window.parent.postMessage({
          type: 'gameDataUpdate',
          gameData: quizGameData,
          quizId: quizId,
          action: 'immediate-save'
        }, '*');
      }
      // 🟢 Add this line to update the question live:
      document.getElementById('questionArea').textContent = questionText;
      startGame();
      document.getElementById('saveStatus').textContent = "Saved!";
      document.getElementById('saveStatus').style.display = '';
      setTimeout(() => { document.getElementById('saveStatus').style.display = 'none'; }, 1200);
    };

    // --- Main Game Start ---
    function startGame() {
      foundWords = [];
      selectedCells = [];
      selecting = false;
      startCell = null;
      score = 0;
      createEmptyGrid();
      placeWords();
      renderWordList();
      renderGrid();
    }

    // Default question
    let questionText = "Find all the hidden words related to nature!";

    // Load saved question from localStorage if in quizEditor
    if (isQuizEditor) {
      try {
        const savedQ = localStorage.getItem('quizEditor_game3_question');
        if (savedQ) questionText = savedQ;
      } catch (e) {}
    }

    // Set the question text to the questionArea div
    document.getElementById('questionArea').textContent = questionText;
  </script>

  <script>
(function hideEditButtonForStudents(){
  // If URL has edit=true we allow edit button, otherwise hide it for students.
  const params = new URLSearchParams(window.location.search);
  const isEditMode = params.get('edit') === 'true';

  function hideAllEditControls() {
    const selectors = [
      '.edit-button',        // main edit button in header
      '#quiz-edit-controls', // optional injected edit container
      '.btn-edit',           // generic edit class
      '.edit-btn',           // other possible edit classes
      '#editorModal'         // hide whole editor modal if you want (optional)
    ].join(',');
    document.querySelectorAll(selectors).forEach(el => {
      if (el) el.style.display = 'none';
    });
  }

  if (!isEditMode) {
    // Hide immediately
    hideAllEditControls();

    // Hide any edit controls added later by observing DOM mutations
    const mo = new MutationObserver(hideAllEditControls);
    mo.observe(document.documentElement || document.body, { childList: true, subtree: true });

    // expose for debugging / cleanup if needed
    window._hideEditButtonsObserver = mo;
  }
})();
  </script>
