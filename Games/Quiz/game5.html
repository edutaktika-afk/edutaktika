<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matching Pairs Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../CSS/game5.css">
<style>
  #editorModal {
  position: fixed;
  z-index: 2000;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.35);
  display: none;
  align-items: center;
  justify-content: center;
}

#editorModal[style*="display: flex"] {
  display: flex !important;
}

#editorCard {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 4px 32px #0003;
  padding: 2.2em 2.2em 1.5em 2.2em;
  min-width: 340px;
  max-width: 100vw;
  max-height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
</style>
<style>
    /* Global Variables from previous style for consistency */
    :root {
        --primary-color: #26a69a; /* Teal */
        --accent-color: #ff9800; /* Amber/Orange */
        --background-color: #f7f9fc;
        --card-background: #ffffff;
        --text-color: #37474f;
        --success-color: #4caf50; /* Green */
        --danger-color: #e53935; /* Red */
        --border-color: #cfd8dc;
    }

    /* Editor Modal Container */
    #editorModal {
        display: none;
        position: fixed;
        z-index: 2000; /* Higher than main modal */
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6); /* Darker overlay */
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    
    /* Editor Card Styling */
    #editorCard {
        background: var(--card-background);
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        max-width: 800px;
        width: 100%;
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        max-height: 95vh;
        overflow-y: auto;
    }
    
    /* Header and Notice */
    #editorCard h2 {
        color: var(--primary-color);
        font-size: 1.8em !important;
        margin-bottom: 10px !important;
        font-weight: 800;
    }
    .notice {
        font-size: 0.85em;
        color: #78909c;
        border-left: 4px solid var(--accent-color);
        padding-left: 10px;
        margin-bottom: 20px;
    }

    /* Editor Layout */
    .editor-flex {
        display: flex;
        gap: 20px;
        flex-grow: 1;
        min-height: 0;
    }
    .col-edit {
        display: flex;
        flex-direction: column;
    }
    .col-edit:first-child {
        flex: 0 0 200px; /* Fixed width for question list */
    }
    .col-edit:last-child {
        flex: 1 1 auto; /* Main editing area */
    }

    /* Labels and Inputs */
    .small {
        font-size: 0.9em;
        font-weight: 600;
        margin-top: 10px;
        margin-bottom: 5px;
        color: var(--text-color);
    }
    #editPrompt, 
    #pairsBox input {
        border: 2px solid var(--border-color);
        border-radius: 6px;
        padding: 10px;
        font-family: inherit;
        font-size: 1em;
        color: var(--text-color);
        background: #fcfcfc;
        transition: border-color 0.2s;
        padding-bottom:30px;
    }
    #editPrompt:focus,
    #pairsBox input:focus {
        border-color: var(--primary-color);
        outline: none;
    }

    #editPrompt {
        min-height: 60px; /* INCREASED MIN HEIGHT */
        resize: vertical; /* Allow vertical resizing, but not horizontal */
    }

    /* Question List (Left Column) */
    .q-list {
        flex-grow: 1;
        overflow-y: auto;
        padding-right: 5px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: #ffffff;
    }
    .qrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #eee;
        transition: background 0.1s;
    }
    .qrow:hover {
        background: #e0f2f1;
    }
    .qrow.active {
        background: var(--primary-color);
        color: white;
        font-weight: 700;
    }
    .qrow.active div {
        color: white !important;
    }
    .qrow.active button {
        background: white;
        color: var(--primary-color);
    }

    /* Pair Editing Rows */
    .pair-edit-row {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .pair-edit-row input {
        flex: 1 1 45%;
    }
    .pair-edit-row button {
        flex-shrink: 0;
        background: var(--danger-color);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 1.1em;
        line-height: 1;
        transition: background 0.2s;
    }
    .pair-edit-row button:hover {
        background: #c03636;
    }

    /* Action Buttons (Footer) */
    .editor-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
    }
    .editor-actions button,
    .addBtn {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
    }
    
    /* Primary & Add Buttons */
    #saveQuestion,
    .addBtn {
        background: var(--primary-color);
        color: white;
    }
    #saveQuestion:hover,
    .addBtn:hover {
        background: #1de9b6;
    }

    /* Secondary Buttons */
    #closeEditor {
        background: #bdbdbd;
        color: #37474f;
    }
    #closeEditor:hover {
        background: #a0a0a0;
    }

    /* Delete Button (Specific overrides from inline style) */
    #deleteQuestion {
        background: var(--danger-color) !important;
        color: white !important;
        margin-left: auto;
    }
    #deleteQuestion:hover {
        background: #c03636 !important;
    }
    
    /* Status Message */
    .status {
        margin-top: 10px;
        font-weight: 600;
    }
    #editStatus {
        color: var(--success-color);
    }
    
    /* Media Query for small screens */
    @media (max-width: 650px) {
        .editor-flex {
            flex-direction: column;
        }
        .col-edit:first-child {
            flex: 1 1 auto;
            max-height: 200px; /* Limit list height on small screens */
        }
        .pair-edit-row {
            flex-wrap: wrap;
        }
        .pair-edit-row input {
            flex: 1 1 100%;
        }
        .pair-edit-row button {
            width: 100%;
        }
        .editor-actions {
            flex-wrap: wrap;
        }
        .editor-actions button {
            flex: 1 1 auto;
        }
        #deleteQuestion {
            margin-left: 0;
        }
    }
</style>
</head>
<body>
<div id="embedRoot">
  <div class="quiz-scale">
  <div class="quiz-wrap" style="position:relative;">
    <button id="editOpen" style="position:absolute;top:18px;right:18px;z-index:10;display:none;">Edit</button>
    <h1>Matching Pairs</h1>
      <div id="progress"><div id="bar"></div></div>
      <div id="questionText"></div>

      <div class="board">
        <div class="col">
          <h3>Left Items</h3>
          <div class="list" id="leftList"></div>
        </div>
        <div class="col">
          <h3>Right Items</h3>
            <div class="list" id="rightList"></div>
        </div>
        <div class="col">
          <h3>Your Matches</h3>
          <div class="matches" id="matchesBox"></div>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
        <button id="finishBtn">Finish</button>
      </div>
    </div>
  </div>
</div>

<!-- Final Modal -->
<div class="modal" id="finalModal" aria-hidden="true">
  <div class="modal-card">
    <h2>Thank You!</h2>
    <p id="finalMsg" style="margin:0;font-size:1.05rem;color:#42596b">Your matches have been saved.</p>
    <button class="primary" id="restartBtn"style="display:none";>Play Again</button>
  </div>
</div>

<!-- Editor Modal -->
<div id="editorModal" aria-hidden="true">
  <div id="editorCard">
    <h2 style="margin:0 0 -6px;font-size:1.9rem;color:#153b56">Edit Matching Sets</h2>
    <p class="notice">Each question contains several left/right pairs. Order of right items is shuffled automatically.</p>
    <div class="editor-flex">
      <div class="col-edit">
        <label class="small">Question List</label>
        <div class="q-list" id="qList"></div>
        <button id="addQuestion" class="addBtn" style="margin-top:6px">Add Question</button>
      </div>
      <div class="col-edit">
        <label class="small">Prompt (optional)</label>
        <textarea id="editPrompt" rows="3" placeholder="Example: Match the countries with their capitals."></textarea>
        <label class="small">Pairs</label>
        <div id="pairsBox" style="display:flex;flex-direction:column;gap:10px"></div>
        <button id="addPair" class="addBtn" type="button">Add Pair</button>
        <div class="editor-actions">
          <button id="saveQuestion" type="button">Save Question</button>
          <button id="closeEditor" type="button" class="secondary">Close</button>
          <button id="deleteQuestion" type="button" class="secondary" style="background:#ffe9e9;color:#c03636">Delete</button>
        </div>
        <div class="status" id="editStatus"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ...existing code...
const quizId = window.location.pathname.split('/').pop().replace('.html','');
// ...existing code...
/* ========= DATA & STATE ========= */
const LS_KEY='match_pairs_v1';
const PROGRESS_KEY = 'match_pairs_progress_v1';
const defaultQuestions = [
  {
    prompt:'Match the animals to their habitats.',
    pairs:[
      {left:'Camel', right:'Desert'},
      {left:'Penguin', right:'Antarctica'},
      {left:'Frog', right:'Pond'},
      {left:'Eagle', right:'Mountains'}
    ]
  },
  {
    prompt:'Match each country to its capital.',
    pairs:[
      {left:'France', right:'Paris'},
      {left:'Japan', right:'Tokyo'},
      {left:'Brazil', right:'Brasilia'}
    ]
  }
];
let questions = []; // Will be loaded

let current=0;
let userMatches=questions.map(q=>[]); // array of {left,right}
let selectedLeft=null; // DOM element
let selectedLeftText='';

/* ========= ELEMENTS ========= */
const questionText=qs('#questionText');
const leftList=qs('#leftList');
const rightList=qs('#rightList');
const matchesBox=qs('#matchesBox');
const nextBtn=qs('#nextBtn');
const finishBtn=qs('#finishBtn');
const bar=qs('#bar');
const prevBtn = qs('#prevBtn');

function qs(s){return document.querySelector(s);}

/* ========= RENDER ========= */
function renderQuestion(){
  const q=questions[current];
  if(!q) return;
  questionText.textContent = q.prompt || ('Matching Set '+(current+1)+' of '+questions.length);
  leftList.innerHTML='';
  rightList.innerHTML='';
  matchesBox.innerHTML='';

  selectedLeft=null; selectedLeftText='';

  // Build left list (original order), excluding already matched
  const matchedLefts = new Set(userMatches[current].map(p=>p.left));
  q.pairs.forEach(p=>{
    if(matchedLefts.has(p.left)) return;
    const btn=createItem(p.left,'left');
    leftList.appendChild(btn);
  });
  if(!leftList.children.length) leftList.classList.add('empty'); else leftList.classList.remove('empty');

  // Build right list (shuffle each render) excluding already matched rights
  const matchedRights = new Set(userMatches[current].map(p=>p.right));
  const rightPool=q.pairs.filter(p=>!matchedRights.has(p.right)).map(p=>p.right);
  shuffle(rightPool).forEach(r=>{
    const btn=createItem(r,'right');
    rightList.appendChild(btn);
  });
  if(!rightList.children.length) rightList.classList.add('empty'); else rightList.classList.remove('empty');

  // Existing matches
  userMatches[current].forEach(pair=>{
    matchesBox.appendChild(renderPairRow(pair));
  });

  // Hide Previous button on first question, show otherwise
  if (prevBtn) {
      prevBtn.style.display = (current === 0) ? 'none' : '';
  }

  updateNav();
  updateBar();
  if(window.__quizFit) setTimeout(window.__quizFit,0);
}
function createItem(text,side){
  const el=document.createElement('div');
  el.className='item';
  el.textContent=text;
  el.dataset.side=side;
  el.addEventListener('click',()=>onItemClick(el));
  return el;
}
function onItemClick(el){
  if(el.dataset.side==='left'){
    // toggle selection
    if(selectedLeft===el){
      el.classList.remove('selected'); selectedLeft=null; selectedLeftText='';
    } else {
      if(selectedLeft) selectedLeft.classList.remove('selected');
      selectedLeft=el;
      selectedLeftText=el.textContent;
      el.classList.add('selected');
    }
  } else { // right item
    if(!selectedLeft) return;
    const leftVal=selectedLeftText;
    const rightVal=el.textContent;
    // record
    userMatches[current].push({left:leftVal, right:rightVal});
    // remove both from lists
    selectedLeft.remove();
    el.remove();
    selectedLeft=null; selectedLeftText='';
    renderMatchesOnly(); // rebuild matches area
    // If there are still unmatched items, keep right list as-is (remaining buttons)
    if(!leftList.children.length) leftList.classList.add('empty');
    if(!rightList.children.length) rightList.classList.add('empty');
    updateNav();
    // In onItemClick, after userMatches[current].push({left:leftVal, right:rightVal});
    saveProgress();
  }
}
function renderMatchesOnly(){
  matchesBox.innerHTML='';
  userMatches[current].forEach(pair=>{
    matchesBox.appendChild(renderPairRow(pair));
  });
}
function renderPairRow(pair){
  const row=document.createElement('div');
  row.className='pair-row';
  row.innerHTML=`<span>${escapeHtml(pair.left)}</span><div class="connector"></div><span>${escapeHtml(pair.right)}</span>`;
  // Allow undo
  row.addEventListener('click',()=>{
    // remove from matches
    const idx=userMatches[current].findIndex(p=>p.left===pair.left && p.right===pair.right);
    if(idx>-1){
      userMatches[current].splice(idx,1);
      // return items to lists
      leftList.classList.remove('empty');
      rightList.classList.remove('empty');
      leftList.appendChild(createItem(pair.left,'left'));
      rightList.appendChild(createItem(pair.right,'right'));
      renderMatchesOnly();
      updateNav();
    }
    // In renderPairRow, after userMatches[current].splice(idx,1);
    saveProgress();
  });
  return row;
}
function allMatched(){
  const total=questions[current].pairs.length;
  return userMatches[current].length===total;
}
function updateNav(){
  nextBtn.classList.remove('active');
  finishBtn.classList.remove('active');
  if(!allMatched()) return;
  const last=current===questions.length-1;
  if(last) finishBtn.classList.add('active'); else nextBtn.classList.add('active');
}
function updateBar(){
  const pct=((current)/Math.max(questions.length-1,1))*100;
  bar.style.width=pct+'%';
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ========= NAV EVENTS ========= */
nextBtn.addEventListener('click', () => {
  if (!allMatched()) return;
  current++;
  saveProgress();
  renderQuestion(); // <-- Add this line
});

finishBtn.addEventListener('click', () => {
  if (!allMatched()) return;
  saveProgress();
  finishQuiz();
});
prevBtn.addEventListener('click', () => {
  if (current > 0) {
    current--;
    saveProgress();
    renderQuestion(); // <-- Add this line
  }
});

/* ========= FINAL MODAL ========= */
const finalModal=qs('#finalModal');
const finalMsg=qs('#finalMsg');
qs('#restartBtn').addEventListener('click', () => {
  closeFinal();
  current = 0;
  userMatches = questions.map(q => []);
  localStorage.removeItem(PROGRESS_KEY);
  
});
function finishQuiz(){
  // lock lists
  leftList.querySelectorAll('.item').forEach(i=>i.style.pointerEvents='none');
  rightList.querySelectorAll('.item').forEach(i=>i.style.pointerEvents='none');
  // Calculate score
  const score = calculateScore();
  // Send score to parent (for saving in quiz system)
  window.parent.postMessage({
    type: 'quizResult',
    payload: {
      score: score,
      maxScore: questions.length,
      answers: userMatches,
      quizId: window.location.pathname.split('/').pop(),
      slideIndex: parentTestIndex
    }
  }, '*');
  // Always close the editor modal if open
  editorModal.style.display = 'none';
  editorModal.setAttribute('aria-hidden','true');
  openFinal();
}
function openFinal(){
  finalMsg.textContent='You completed '+questions.length+' matching set'+(questions.length===1?'':'s')+'.';
  finalModal.style.display='flex';
  finalModal.setAttribute('aria-hidden','false');
  if(window.__quizFit) setTimeout(window.__quizFit,0);
}
function closeFinal(){
  finalModal.style.display='none';
  finalModal.setAttribute('aria-hidden','true');
}

/* ========= EDITOR ========= */
const editorModal=qs('#editorModal');
const qList=qs('#qList');
const editPrompt=qs('#editPrompt');
const pairsBox=qs('#pairsBox');
const editStatus=qs('#editStatus');
const addQuestionBtn=qs('#addQuestion');
const addPairBtn=qs('#addPair');
const saveQuestionBtn=qs('#saveQuestion');
const deleteQuestionBtn=qs('#deleteQuestion');
const closeEditorBtn=qs('#closeEditor');
let editingIndex=0;

closeEditorBtn.addEventListener('click',closeEditor);
addQuestionBtn.addEventListener('click',addQuestion);
addPairBtn.addEventListener('click',()=>addPairRow('',''));
saveQuestionBtn.addEventListener('click',saveEditingQuestion);
deleteQuestionBtn.addEventListener('click',deleteEditingQuestion);

function openEditor(){
  buildQList();
  loadEditingQuestion(editingIndex);
  editStatus.textContent='';
  editorModal.style.display='flex';
  editorModal.setAttribute('aria-hidden','false');
  if(window.__quizFit) setTimeout(window.__quizFit,0);
}
function closeEditor(){
  editorModal.style.display='none';
  editorModal.setAttribute('aria-hidden','true');
  if(window.__quizFit) setTimeout(window.__quizFit,0);
}
function buildQList(){
  qList.innerHTML='';
  questions.forEach((q,i)=>{
    const r=document.createElement('div');
    r.className='qrow'+(i===editingIndex?' active':'');
    r.innerHTML='<div style="font-size:.8rem;font-weight:600;color:#38546a">'+(i+1)+'. '+escapeHtml((q.prompt||'Untitled').slice(0,70))+'</div><div class="inline"></div>';
    const btn=document.createElement('button');
    btn.textContent='Edit';
    btn.addEventListener('click',()=>{editingIndex=i;buildQList();loadEditingQuestion(i);});
    r.querySelector('.inline').appendChild(btn);
    qList.appendChild(r);
  });
}
function loadEditingQuestion(i){
  const q=questions[i]; if(!q) return;
  editPrompt.value=q.prompt||'';
  pairsBox.innerHTML='';
  q.pairs.forEach(p=>addPairRow(p.left,p.right));
  if(!q.pairs.length) addPairRow('','');
}
function addPairRow(left='',right=''){
  const row=document.createElement('div');
  row.className='pair-edit-row';
  row.innerHTML=`
    <input type="text" placeholder="Left" value="${escapeHtml(left)}">
    <input type="text" placeholder="Right" value="${escapeHtml(right)}">
    <button type="button">&times;</button>
  `;
  row.querySelector('button').addEventListener('click',()=>row.remove());
  pairsBox.appendChild(row);
}

function saveEditingQuestion(){
  const prompt = editPrompt.value.trim();
  const rows = [...pairsBox.querySelectorAll('.pair-edit-row')];
  const pairs = [];
  rows.forEach(r => {
    const l = r.querySelectorAll('input')[0].value.trim();
    const rt = r.querySelectorAll('input')[1].value.trim();
    if (l && rt) pairs.push({left: l, right: rt});
  });
  if (!pairs.length) {
    status('Add at least one complete pair', true);
    return;
  }
  questions[editingIndex] = {prompt, pairs};

  // Update UI immediately
  buildQList();
  current = 0;
  userMatches = questions.map(q => []);
  renderQuestion();
  if (window.__quizFit) setTimeout(window.__quizFit, 0);

  // Show a temporary "Saved!" indicator
  editStatus.textContent = "Saved!";
  editStatus.style.display = '';
  setTimeout(() => { editStatus.textContent = ""; }, 1200);

  // Send to parent (quizEditor) for saving
  persist();
}

  function deleteEditingQuestion(){
    if(!questions.length) return;
    if(!confirm('Delete this set?')) return;
    questions.splice(editingIndex,1);
    persist();
    if(!questions.length){
      questions.push({prompt:'Sample set',pairs:[{left:'Sun',right:'Star'}]});
    }
    editingIndex=Math.min(editingIndex,questions.length-1);
    buildQList();
    loadEditingQuestion(editingIndex);
    current=0;
    userMatches=questions.map(q=>[]);
    
    if(window.__quizFit) setTimeout(window.__quizFit,0);
  }

  function addQuestion(){
    questions.push({prompt:'New matching set',pairs:[{left:'Left',right:'Right'}]});
    editingIndex=questions.length-1;
    persist();
    buildQList();
    loadEditingQuestion(editingIndex);
    if(window.__quizFit) setTimeout(window.__quizFit,0);
  }

  function status(msg,err){
    editStatus.textContent=msg;
    editStatus.style.color= err? 'var(--danger)':'var(--accent)';
  }


function saveProgress() {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify({
    userMatches,
    current
  }));
}

function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    if (saved && Array.isArray(saved.userMatches) && typeof saved.current === 'number') {
      userMatches = saved.userMatches;
      current = saved.current;
    }
  } catch (e) {}
}

function calculateScore() {
  let score = 0;
  questions.forEach((q, idx) => {
    const user = userMatches[idx] || [];
    // Count only correct matches
    user.forEach(pair => {
      if (q.pairs.some(p => p.left === pair.left && p.right === pair.right)) {
        score++;
      }
    });
  });
  return score;
}

/* ========= UTIL ========= */
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ========= SCALING (FIT) ========= */
(function(){
  const root=document.getElementById('embedRoot');
  const scaleWrap=document.querySelector('.quiz-scale');
  const quiz=document.querySelector('.quiz-wrap');
  if(!root||!scaleWrap||!quiz) return;
  function naturalHeight(){
    const prev=scaleWrap.style.transform;
    scaleWrap.style.transform='none';
    const h=quiz.offsetHeight;
    scaleWrap.style.transform=prev;
    return h;
  }
  function fit(){
    const w=quiz.offsetWidth;
    const h=naturalHeight();
    const rw=root.clientWidth;
    const rh=root.clientHeight;
    const scale=Math.min(rw/w, rh/h, 1);
    scaleWrap.style.transform=`scale(${scale})`;
  }
  new ResizeObserver(fit).observe(root);
  window.addEventListener('orientationchange',fit);
  window.addEventListener('load',fit);
  window.__quizFit=fit;
  setTimeout(fit,60);
})();

/* ========= INIT ========= */


let parentTestIndex = 0;
window.addEventListener('message', function(event) {
  // Handle test index
  if (event.data && event.data.type === 'setTestIndex') {
    parentTestIndex = event.data.index;
  }
  // Handle updated game data from parent (quizEditor)
  if (
    event.data &&
    (
      (event.data.type === 'loadQuizGameData' && event.data.gameData?.questions) ||
      (event.data.type === 'currentGameData' && event.data.gameData?.questions)
    )
  ) {
    questions = event.data.gameData.questions;
    userMatches = questions.map(q => []);
    current = 0;
    renderQuestion();
    if (typeof buildQList === 'function') buildQList();
    if (typeof loadEditingQuestion === 'function') loadEditingQuestion(current);
    // Optionally show a status message
    editStatus.textContent = "Loaded updated questions!";
    setTimeout(() => { editStatus.textContent = ""; }, 1200);
  }
});





// When sending the score:
window.parent.postMessage({
  type: 'quizResult',
  payload: {
    score: score,
    maxScore: questions.length,
    answers: userAnswers,
    quizId: window.location.pathname.split('/').pop(),
    slideIndex: parentTestIndex // <-- Always use this!
  }
}, '*');
function saveQuestionsToFirebase(quizId, questions, callback) {
  // Use your Firebase setup here
  firebase.database().ref('quizzes/' + quizId + '/game5Questions').set(questions)
    .then(() => {
      status('Saved to Firebase!');
      if (typeof callback === 'function') callback();
    })
    .catch((e) => {
      status('Error saving to Firebase', true);
    });
}
function loadQuestionsFromFirebase(quizId, callback) {
  firebase.database().ref('quizzes/' + quizId + '/game5Questions').once('value')
    .then(snapshot => {
      const data = snapshot.val();
      if (Array.isArray(data)) {
        callback(data);
      } else {
        callback(null);
      }
    });
}

function isQuizEditor() {
  const params = new URLSearchParams(window.location.search);
  return (
    params.get('edit') === 'true' ||
    params.get('mode') === 'edit' ||
    params.get('quizEditor') === '1' ||
    window.name === 'quizEditor' ||
    window._isQuizEditor === true
  );
}

function loadQuestions(callback) {
  if (isQuizEditor() && typeof firebase !== 'undefined') {
    // In quizEditor, load from Firebase if available, else localStorage, else default
    loadQuestionsFromFirebase(quizId, function(firebaseQuestions) {
      if (firebaseQuestions && Array.isArray(firebaseQuestions)) {
        questions = firebaseQuestions;
      } else {
        const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
        if (Array.isArray(saved) && saved.every(q => q && Array.isArray(q.pairs))) {
          questions = saved;
        } else {
          questions = JSON.parse(JSON.stringify(defaultQuestions));
        }
      }
      callback();
    });
  } else {
    // In normal quiz view, ALWAYS use defaultQuestions
    questions = JSON.parse(JSON.stringify(defaultQuestions));
    callback();
  }
}

function persist() {
  if (isQuizEditor()) {
    // Prepare game data object
    const gameData = {
      questions: questions,
      lastModified: new Date().toISOString(),
      gameType: 'matching-pairs',
      gameUrl: window.location.href.split('?')[0],
      isCustomized: true,
      totalQuestions: questions.length
    };
    // Send to parent (quizEditor) for saving
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'saveQuizGameData',
        gameData,
        quizId: quizId,
        source: 'game-editor'
      }, '*');
      window.parent.postMessage({
        type: 'gameDataUpdate',
        gameData,
        quizId: quizId,
        action: 'immediate-save'
      }, '*');
    }
  } else {
    // Standalone mode: save to localStorage
    localStorage.setItem(LS_KEY, JSON.stringify(questions));
  }
}

// Listen for updated questions from parent (quizEditor)
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'loadQuizGameData' && event.data.gameData?.questions) {
    questions = event.data.gameData.questions;
    userMatches = questions.map(q => []);
    current = 0;
    renderQuestion();
    buildQList && buildQList();
    loadEditingQuestion && loadEditingQuestion(current);
    // Optionally show a status message
    editStatus.textContent = "Loaded updated questions!";
    setTimeout(() => { editStatus.textContent = ""; }, 1200);
  }
});
</script>
