<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math True or False Game</title>
<style>
    :root {
        --primary: #4CAF50; /* A more vibrant Green */
        --secondary: #FFC107; /* Amber/Yellow for buttons */
        --peach: #FF69B4; /* Hot Pink Accent */
        --forest-green: #388E3C; /* Darker green for text */
        --sun-yellow: #FFEB3B; /* Lighter yellow accent */
        --white: #ffffff;
        --dark-text: #212121;
        --correct: #43A047; /* Darker green for correct feedback */
        --incorrect: #F44336; /* Red for incorrect feedback */
    }
    body {
        font-family: 'Comic Neue', Arial, sans-serif;
        background: var(--primary);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .game-container {
        background: var(--white);
        border-radius: 20px; /* Slightly rounder */
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); /* Deeper shadow for pop */
        padding: 35px 35px 45px;
        text-align: center;
        max-width: 480px; /* Wider container */
        width: 96vw;
        position: relative;
        transition: transform 0.3s ease;
    }
    .game-container:hover {
        transform: scale(1.02);
    }
    /* top bar / progress */
    .top-bar { display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:10px; }
    #progress { color:var(--forest-green); font-weight:800; font-size:1rem; letter-spacing: 0.5px; }
    .hint { font-size:0.82rem; color:#666; }

    .question {
        font-size: 1.8rem; /* Larger question text */
        margin: 30px 0 35px;
        color: var(--dark-text);
        font-weight: 900; /* Extra bold */
        min-height: 60px; /* More space for question */
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-bottom: 2px solid var(--secondary);
    }
    .btn {
        padding: 16px 50px;
        border-radius: 12px;
        background: var(--secondary);
        color: var(--dark-text);
        border: 4px solid var(--secondary); /* Border for depth */
        font-size: 1.35rem;
        font-weight: bold;
        margin: 12px;
        cursor: pointer;
        box-shadow: 0 6px 0 var(--forest-green); /* 3D effect */
        transition: all .15s ease;
        position: relative;
        user-select: none;
        outline: none;
    }
    .btn:active {
        box-shadow: 0 2px 0 var(--forest-green);
        transform: translateY(4px);
    }
    .btn:hover:not(.selected) {
        background: var(--sun-yellow);
        border-color: var(--sun-yellow);
    }
    /* Selected option styling - More prominent */
    .btn.selected {
        background: var(--primary);
        color: var(--white);
        border-color: var(--primary);
        outline: 4px solid rgba(255, 255, 255, 0.5); /* White highlight on selection */
        box-shadow: 0 4px 0 var(--forest-green);
        transform: translateY(2px);
    }
    /* visible check badge on selected option */
    .btn.selected::after{
        content: "⭐"; /* Changed to star for more fun */
        position: absolute;
        right: 8px;
        top: 4px;
        background: var(--peach);
        color: var(--white);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:800;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        font-size:1.1rem;
        line-height: 1;
        padding-top: 2px;
    }

    #feedback {
        font-size: 1.25rem;
        margin: 18px 0 10px;
        min-height: 30px;
        font-weight: bold;
        transition: color 0.3s;
    }
    /* Re-enable feedback display for visual results (Added custom styles) */
    #feedback.correct { color: var(--correct); }
    #feedback.incorrect { color: var(--incorrect); }
    #feedback:empty { display: none; } /* Hide only when empty */

    /* Edit button prominent style (visible only in editor mode) */
    /* Edit Button Style */
    #editBtn, #edit-open-btn {
        background: #ffc107; /* Amber for edit */
        color: var(--dark-text);
        border: 2px solid #ff9800;
        padding: 8px 15px;
        border-radius: 10px;
        font-weight: 700;
        box-shadow: 0 2px 0 #ff9800;
        transition: all .2s;
        cursor: pointer;
    }
    #editBtn:active, #edit-open-btn:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 #ff9800;
    }
    .edit-open-btn .dot {
        width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0.06);
    }

    #final-modal, #edit-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .6);
        z-index: 100000;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(4px);
    }
    #final-modal > div, #edit-modal > div {
        background: var(--white);
        padding: 40px;
        border-radius: 20px;
        max-width: 550px;
        width: 96vw;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-height: 90vh;
        overflow: auto;
    }
    #play-again-btn {
        padding: 18px 48px;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        border: 0;
        font-size: 1.7rem;
        font-weight: bold;
        margin-top: 10px;
        cursor: pointer;
        box-shadow: 0 6px 0 var(--forest-green);
        transition: all .15s ease;
    }
    #play-again-btn:active {
        box-shadow: 0 2px 0 var(--forest-green);
        transform: translateY(4px);
    }
    /* Style for Previous/Next buttons */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }
    /* Apply 3D and hover effect to navigation buttons */
    #prev-btn, #next-btn {
        padding: 12px 28px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        border: 0;
        box-shadow: 0 4px 0 #28602B; /* Darker green shadow */
        transition: all .15s ease;
    }
    #prev-btn {
        background: #C8E6C9; /* Light green background */
        color: var(--dark-text);
        box-shadow: 0 4px 0 #9E9E9E;
    }
    #next-btn {
        background: var(--primary);
        color: #fff;
    }
    #prev-btn:active, #next-btn:active {
        box-shadow: 0 1px 0 #28602B;
        transform: translateY(3px);
    }

    #done-btn {
        background: var(--peach); /* Use peach for final action */
        color: var(--white);
        border: 0;
        padding: 16px 50px;
        font-size: 1.35rem;
        font-weight: bold;
        border-radius: 12px;
        margin-top: 20px;
        cursor: pointer;
        box-shadow: 0 6px 0 #cc5490;
        transition: all .15s ease;
    }
    #done-btn:active {
        box-shadow: 0 2px 0 #cc5490;
        transform: translateY(4px);
    }

    .small-btn {
        /* ... existing styles ... */
        box-shadow: 0 2px 0 var(--forest-green);
    }

    /* Edit Modal Button Styles */
    #add-question-btn {
        background: var(--primary);
        box-shadow: 0 4px 0 var(--forest-green);
    }
    #add-question-btn:active {
        box-shadow: 0 1px 0 var(--forest-green);
        transform: translateY(3px);
    }
    #save-questions-btn {
        background: var(--peach);
        box-shadow: 0 4px 0 #cc5490;
    }
    #save-questions-btn:active {
        box-shadow: 0 1px 0 #cc5490;
        transform: translateY(3px);
    }
    .edit-list-row button {
        background: var(--incorrect);
    }
    .status-msg {
        font-size: .9rem;
        font-weight: 600;
    }
    /* Remove original explicit hide from feedback */
    /* #feedback{display:none} */
</style>
</head>
<body>
  <div class="game-container">
    <button id="edit-open-btn" class="small-btn">Edit</button>
<div id="quiz-instruction" style="font-size:1.08rem;color:#000000;margin-bottom:10px;font-weight:500;"></div>
    <!-- Add this inside .game-container, just above the .question div -->
    <div class="top-bar" style="justify-content: center; margin-top: 5px;">
      <span id="progress"></span>
    </div>

    <div class="question" id="question"></div>
    <button class="btn" id="true-btn">True</button>
    <button class="btn" id="false-btn">False</button>
    <div id="feedback"></div>
    <div style="display:flex;justify-content:center;gap:12px;margin-top:10px;">
      <button id="prev-btn" style="display:none;background:#e4edf4;color:#174369;border:0;padding:12px 28px;border-radius:12px;font-size:1.1rem;font-weight:600;">Previous</button>
      <button id="next-btn" style="display:none;background:var(--primary);color:#fff;border:0;padding:12px 28px;font-size:1.1rem;font-weight:600;border-radius:12px;">Next</button>
    </div>
    <button id="done-btn" style="display:none;background:var(--primary);color:#fff;border:0;padding:14px 44px;font-size:1.25rem;font-weight:bold;border-radius:12px;margin-top:18px;box-shadow:0 4px 14px -3px rgba(0,0,0,.3);cursor:pointer;">Done</button>
  </div>



  <!-- EDIT MODAL -->
  <div id="edit-modal" aria-hidden="true">
    <div>
      <h3 style="margin:0;font-size:1.4rem;color:var(--primary);">Edit Questions</h3>
      <div class="editor-row">
  <label for="edit-instruction" style="font-weight:600;">Instruction</label>
  <textarea id="edit-instruction" rows="2" style="width:100%;resize:vertical;"></textarea>
</div>
      <div id="edit-list"></div>
      <div class="status-msg" id="edit-status"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="add-question-btn">Add Question</button>
        <button id="save-questions-btn">Save & Close</button>
        <button id="edit-cancel-btn" style="background:#ddd;color:#222;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem">Cancel</button>
      </div>
    </div>
  </div>

<script>
const LS_KEY='tf_quiz_questions_v1';
let questions = [
  { q: "7 + 5 = 12", answer: true },
  { q: "9 - 4 = 6", answer: false },
  { q: "3 × 3 = 9", answer: true },
  { q: "15 ÷ 5 = 2", answer: false },
  { q: "8 + 2 = 10", answer: true }
];
try{
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(Array.isArray(saved)&&saved.length && saved.every(x=>typeof x.q==='string' && typeof x.answer==='boolean')) questions=saved;
}catch(e){}

let current = 0;
let score = 0;
let answeredCurrent = false;
let userAnswers = []; // NEW: store student selections
let parentTestIndex = 0;
let quizInstruction = "Read each statement carefully. Choose True or False for each question.";

const qEl = document.getElementById('question');
const feedbackEl = document.getElementById('feedback');
const trueBtn = document.getElementById('true-btn');
const falseBtn = document.getElementById('false-btn');
const nextBtn = document.getElementById('next-btn');
const prevBtn = document.getElementById('prev-btn');
const finalModal = document.getElementById('final-modal');
const finalScore = document.getElementById('final-score');
const progressEl = document.getElementById('progress');
const doneBtn = document.getElementById('done-btn');

window.addEventListener('message', function(event) {
  if (
    event.data &&
    (
      (event.data.type === 'loadQuizGameData' && event.data.gameData?.questions) ||
      (event.data.type === 'currentGameData' && event.data.gameData?.questions)
    )
  ) {
    questions = event.data.gameData.questions;
    quizInstruction = event.data.gameData.instruction || quizInstruction;
    current = 0;
    userAnswers = new Array(questions.length).fill(undefined);
    score = 0;
    loadQuestion();
  }
  if (event.data && event.data.type === 'setTestIndex') {
    parentTestIndex = event.data.index;
  }
});

function loadQuestion(){
  const q = questions[current];
  qEl.textContent = q ? q.q : '';
  feedbackEl.textContent='';
  answeredCurrent=false;
  // Show progress (e.g. "Question 2 of 5")
  progressEl.textContent = `Question ${current + 1} of ${questions.length}`;
  // hide Next unless a choice is made and not on last question
  nextBtn.style.display = (typeof userAnswers[current] !== 'undefined' && current < questions.length - 1) ? 'inline-block' : 'none';
  prevBtn.style.display = (current > 0) ? 'inline-block' : 'none';
  // Show Done button only on last question and if answered
  doneBtn.style.display = (current === questions.length - 1 && typeof userAnswers[current] !== 'undefined') ? 'inline-block' : 'none';
  enableAnswerButtons(true);
  updateSelectionUI();
  document.getElementById('quiz-instruction').textContent = quizInstruction || "";
  document.getElementById('edit-instruction').value = quizInstruction || "";
}

// enable or disable answer buttons
function enableAnswerButtons(on){
  trueBtn.disabled=!on;
  falseBtn.disabled=!on;
  trueBtn.style.opacity= on? '1':'0.55';
  falseBtn.style.opacity= on? '1':'0.55';
}

// update visual selection state for current question
function updateSelectionUI(){
  const sel = userAnswers[current];
  if(sel === true){
    trueBtn.classList.add('selected');
    falseBtn.classList.remove('selected');
  } else if(sel === false){
    falseBtn.classList.add('selected');
    trueBtn.classList.remove('selected');
  } else {
    trueBtn.classList.remove('selected');
    falseBtn.classList.remove('selected');
  }
}

function checkAnswer(ans){
  // allow changing selection until user moves to next question
  userAnswers[current] = ans;
  answeredCurrent = true;
  // Show Next only if not on last question
  nextBtn.style.display = (current < questions.length - 1) ? 'inline-block' : 'none';
  // Show Done button if on last question
  if(current === questions.length - 1) {
    doneBtn.style.display = 'inline-block';
  }
  enableAnswerButtons(true);
  updateSelectionUI();
}

trueBtn.onclick=()=>checkAnswer(true);
falseBtn.onclick=()=>checkAnswer(false);

nextBtn.onclick=()=>{
  if(typeof userAnswers[current] === 'undefined' || userAnswers[current] === null) return;
  current++;
  if(current < questions.length){
    loadQuestion();
  }
  // No else: do nothing on last question, no modal, no play again
};

prevBtn.onclick = () => {
  if (current > 0) {
    current--;
    loadQuestion();
  }
};

/* ---------- EDIT FEATURE ---------- */
const editModal = document.getElementById('edit-modal');
const editOpenBtn = document.getElementById('edit-open-btn');
const editList = document.getElementById('edit-list');
const editStatus = document.getElementById('edit-status');
const addQuestionBtn = document.getElementById('add-question-btn');
const saveQuestionsBtn = document.getElementById('save-questions-btn');
const editCancelBtn = document.getElementById('edit-cancel-btn');

editOpenBtn.addEventListener('click', openEditor);
editCancelBtn.addEventListener('click',closeEditor);
addQuestionBtn.addEventListener('click',()=> addRow('',true));

saveQuestionsBtn.addEventListener('click', saveEditorQuestions);

function openEditor(){
  editList.innerHTML='';
  questions.forEach(q=> addRow(q.q,q.answer));
  editStatus.textContent='';
  editModal.style.display='flex';
  editModal.setAttribute('aria-hidden','false');
}

function closeEditor(){
  editModal.style.display='none';
  editModal.setAttribute('aria-hidden','true');
}

function addRow(text='',ans=true){
  const row=document.createElement('div');
  row.className='edit-list-row';
  row.innerHTML=`
    <input type="text" class="row-text" placeholder="Question text" value="${escapeHtml(text)}">
    <select class="row-ans">
      <option value="true" ${ans?'selected':''}>True</option>
      <option value="false" ${!ans?'selected':''}>False</option>
    </select>
    <button type="button" class="del">X</button>
  `;
  row.querySelector('.del').addEventListener('click',()=> row.remove());
  editList.appendChild(row);
}

function saveEditorQuestions(){
  // Get the edited instruction
  quizInstruction = document.getElementById('edit-instruction').value.trim();

  const rows=[...editList.querySelectorAll('.edit-list-row')];
  const newQs=[];
  for(const r of rows){
    const txt=r.querySelector('.row-text').value.trim();
    if(!txt){ editStatus.style.color='#c0392b'; editStatus.textContent='Empty question found.'; return; }
    const ans=r.querySelector('.row-ans').value==='true';
    newQs.push({q:txt,answer:ans});
  }
  if(!newQs.length){ editStatus.style.color='#c0392b'; editStatus.textContent='Add at least one question.'; return; }
  questions=newQs;
  // Only save to localStorage if not in quizEditor mode
  if (!isQuizEditor) {
    localStorage.setItem(LS_KEY, JSON.stringify(questions));
  }
  // Send updated questions and instruction to parent for saving in Firebase (quizEditor mode)
  if (isQuizEditor && window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'saveQuizGameData',
      gameData: { questions, instruction: quizInstruction },
      quizId: window.location.pathname.split('/').pop(),
      source: 'game-editor'
    }, '*');
  }
  // Reset game
  current=0; score=0;
  loadQuestion();
  editStatus.style.color='var(--primary)';
  editStatus.textContent='Saved!';
  setTimeout(closeEditor,450);
}

/* Utility to escape user-entered text */
function escapeHtml(s){
  return s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[ch]));
}

/* Init */
loadQuestion();

/* ---------- EDIT BUTTON VISIBILITY: show ONLY when opened from quizEditor or explicitly allowed ---------- */
;(function controlEditButtonVisibility(){
  const editOpenBtn = document.getElementById('edit-open-btn');
  if (!editOpenBtn) return;

  function show() { editOpenBtn.style.display = ''; }
  function hide() { editOpenBtn.style.display = 'none'; }

  // default: hide for both teacher/student quizView
  hide();

  try {
    const params = new URLSearchParams(location.search);
    const explicitEditor = params.get('editor') === 'true' || params.get('edit') === 'true' || params.get('mode') === 'edit';

    // If explicitly opened in editor mode via URL, show
    if (explicitEditor) { show(); return; }

    // If referrer contains "quizeditor" (best-effort), show
    if (document.referrer && document.referrer.toLowerCase().includes('quizeditor')) { show(); return; }

    // Try to detect opener/parent (may throw cross-origin) — show only if it appears to be the quizEditor
    try {
      if (window.parent && window.parent !== window && String(window.parent.location.href).toLowerCase().includes('quizeditor')) { show(); return; }
    } catch (e) { /* ignore cross-origin */ }
    try {
      if (window.opener && String(window.opener.location.href).toLowerCase().includes('quizeditor')) { show(); return; }
    } catch (e) { /* ignore cross-origin */ }

  } catch (e) {
    // keep hidden on any error
    console.warn('controlEditButtonVisibility error', e);
  }

  // Allow parent to override visibility via postMessage:
  // { type: 'allowEdit', allow: true }  -> show
  // { type: 'hideEditUI' }              -> hide
  window.addEventListener('message', (ev) => {
    try {
      const d = ev.data || {};
      if (d && d.type === 'allowEdit' && d.allow === true) show();
      if (d && d.type === 'hideEditUI') hide();
    } catch (err) { /* ignore */ }
  }, false);

  // Ensure the edit button still opens editor if visible
  editOpenBtn.addEventListener('click', (e) => {
    // if hidden do nothing
    if (getComputedStyle(editOpenBtn).display === 'none') return;
    openEditor();
  });
})();

let isQuizEditor = false;
try {
  const params = new URLSearchParams(location.search);
  isQuizEditor = params.get('editor') === 'true' || params.get('edit') === 'true' || params.get('mode') === 'edit' || window.name === 'quizEditor' || window._isQuizEditor === true;
} catch {}

doneBtn.onclick = () => {
  // Calculate score
  let score = 0;
  for (let i = 0; i < questions.length; i++) {
    if (userAnswers[i] === questions[i].answer) score++;
  }
  // Send result to parent for saving in Firebase
  window.parent.postMessage({
    type: 'quizResult',
    payload: {
      score: score,
      maxScore: questions.length,
      answers: userAnswers,
      quizId: window.location.pathname.split('/').pop(),
      slideIndex: parentTestIndex // <-- Always use this!
    }
  }, '*');
  // Optionally disable the button or show a message
  doneBtn.disabled = true;
  doneBtn.textContent = "Submitted!";

  if (isQuizEditor && window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: 'saveQuizGameData',
      gameData: { questions, instruction: quizInstruction },
      quizId: window.location.pathname.split('/').pop(),
      source: 'game-editor'
    }, '*');
  }
};
</script>

<style>
        #infoModal .modal-content ul {
            padding-left: 1.2em;
        }
        .modal-content {
            background-color:rgb(237, 201, 153);
              max-height: 90vh;
  overflow-y: auto;
  box-sizing: border-box;
        }
    </style>

<!-- Instructions Modal -->
<div class="modal" id="infoModal" style="display:none;position:fixed;z-index:10000;left:0;top:0;width:100vw;height:100vh;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);">
    <div class="modal-content" style="max-width:620px;width:80vw;text-align:left;background:rgb(241, 241, 241);padding:32px 24px;border-radius:14px;box-shadow:0 4px 24px #0002;position:relative;">
        <button class="close-btn" id="closeInfoBtn" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;">&times;</button>
        <div style="font-size:1.3em;font-weight:700;margin-bottom:0.7em;text-align:center;">
            How to Set Answer.
        </div>
        <ul style="font-size:1.1em;line-height:1.7;padding-left:1.2em;">
            <li>Read each statement carefully. Click "True" or "False" for each question.</li>
            <img src="../../images/GIF/tof.gif" alt="Example game with letters and image" style="width:90%;max-width:520px;height:60vh;border-radius:12px;box-shadow:0 2px 8px #0002;margin-top:0.5em;">
        </ul>
    </div>
</div>
    
<script>
// Place this at the end of your script section

const infoModal = document.getElementById('infoModal');
const closeInfoBtn = document.getElementById('closeInfoBtn');

// Show modal at start
window.addEventListener('DOMContentLoaded', () => {
    infoModal.style.display = 'flex';
});

// Optional: close modal when clicking close or outside content
closeInfoBtn.onclick = () => { infoModal.style.display = 'none'; };
infoModal.onclick = e => { if (e.target === infoModal) infoModal.style.display = 'none'; };

</script>

</body>
</html>
