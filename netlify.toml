[build]
  command = "npm run build"
  publish = "deploy"

# Editor SPA deep link handling
# This redirect preserves query parameters automatically
[[redirects]]
  from = "/editor/*"
  to = "/editor/index.html"
  status = 200
  force = false

# Explicit redirect for editor root (without trailing path)
[[redirects]]
  from = "/editor"
  to = "/editor/index.html"
  status = 200
  force = false

# Teacher/Student sections (routes land on their own HTML entrypoints)
[[redirects]]
  from = "/teacher/*"
  to = "/Teacher/homepage.html"
  status = 200

[[redirects]]
  from = "/student/*"
  to = "/Student/homepage.html"
  status = 200

# Optional: catch-all SPA fallback for root app
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Security & caching headers (baseline)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "no-cache"

# Environment variables for build
# These are set in Netlify Dashboard > Site settings > Environment variables
# For production, set in Netlify Dashboard (not in this file for security)
# 
# Required for Polotno SDK:
#   Key: VITE_POLOTNO_API_KEY
#   Value: KZiuYryOVcs9sz8q8A1l (without the pipe "|" character)
#
# Note: Vite only exposes variables prefixed with VITE_ to the client
# The pipe character "|" is added by Polotno SDK internally, don't include it in the value

# Secrets Scanning Configuration
# IMPORTANT: Set this environment variable in Netlify Dashboard to allow Firebase API keys
# Firebase API keys are safe to expose in client-side code (they're meant to be public)
# 
# Go to: Netlify Dashboard > Site settings > Environment variables
# Add: SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES
# Value: AIzaSyB5BbeLLvPX8l1c4Lq0f-CmIUml4hQOQlE
#
# This tells Netlify's secrets scanner to ignore this specific Firebase API key
# while still scanning for other actual secrets
