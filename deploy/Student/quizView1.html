    <style>
    /* Make presentation area strictly 4:3 and responsive */
html, body {
    margin: 0;
    padding: 0;
    background: #222;
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    min-width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* REMOVE overflow: hidden; */
    /* REMOVE position: fixed; */
}
    /* Canvas styling with proper constraints - use 4:3 (1024x768) */
    #presentation-canvas { 
        width: 1024px; 
        height: 768px; 
        max-height: 100vh; 
        display: block;
        object-fit: contain;
    }

    /* Presentation wrapper enforces 4:3 aspect ratio */
    .presentation-canvas-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(1024px, 95vw);
        aspect-ratio: 4 / 3; /* strict 4:3 */
        background: #000;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(2,6,23,0.6);
        margin: 0 auto;

    }

    /* Game iframe must also fill the 4:3 area */
    #game-iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 10;
    }

    /* Back button kept visible but unobtrusive */
    .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
    }

    /* Responsive tweaks (maintain 4:3 on small screens) */
    @media (max-width: 640px) {
        .presentation-canvas-wrapper { width: calc(100vw - 24px); }
    }

    /* Prevent scrolling and ensure full viewport usage */
    html, body { 
        margin: 0; 
        padding: 0;
        background: #222; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh;
        max-height: 100vh;
        overflow: hidden; /* Prevent scrolling */
        position: fixed;
        width: 100%;
        height: 100%;
    }

    /* Back button styling */
    .back-btn { 
        position: fixed; 
        top: 16px; 
        left: 16px; 
        background: #fff; 
        color: #232946; 
        border: none; 
        border-radius: 6px; 
        padding: 8px 18px; 
        font-weight: 600; 
        cursor: pointer; 
        font-size: 1rem;
        z-index: 100;
    }

    /* GIF overlay styling */
    .canvas-gif-overlay {
        pointer-events: none;
        z-index: 50;
        position: absolute;
    }

    /* Navigation bar styling */
    .nav-bar {
        position: fixed;
        bottom: 1px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        gap: 12px;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 8px;
        backdrop-filter: blur(4px);
    }

    /* Navigation buttons */
    .nav-btn {
        padding: 8px 18px;
        border-radius: 6px;
        border: none;
        background: #b39ddb;
        color: #232946;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .nav-btn:hover {
        background: #9575cd;
        transform: translateY(-1px);
    }

    .nav-btn:disabled {
        background: #666;
        color: #999;
        cursor: not-allowed;
        transform: none;
    }

    /* Slide indicator */
    .slide-indicator {
        font-size: 1.1em;
        font-weight: bold;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 12px;
    }

    /* Game iframe styling */
    #game-iframe {
        position: absolute;
        border: none;
        z-index: 10;
        pointer-events: auto;
    }

    @media (max-width: 768px) {
        .nav-bar {
            bottom: 12px;
            gap: 8px;
            padding: 6px 12px;
        }
        
        .nav-btn {
            padding: 6px 12px;
            font-size: 0.9rem;
        }
        
        .slide-indicator {
            font-size: 1rem;
            padding: 0 8px;
        }
        
        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 0.9rem;
        }
    }

    /* Prevent text selection and context menu */
    * {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
    }

    /* Hide scrollbars completely */
    ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
    }

    html {
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

<script>
function showFullscreenBtnIfNeeded() {
    const btn = document.getElementById('fullscreen-btn');
    // Show only if width is greater than 800px (desktop)
    if (window.innerWidth > 300) {
        btn.style.display = 'block';
    } 
    else {
        btn.style.display = 'none';
    }
}
window.addEventListener('resize', showFullscreenBtnIfNeeded);
window.addEventListener('orientationchange', showFullscreenBtnIfNeeded);
document.addEventListener('DOMContentLoaded', showFullscreenBtnIfNeeded);

document.getElementById('fullscreen-btn').onclick = function() {
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
    } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
    } else if (wrapper.msRequestFullscreen) {
        wrapper.msRequestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(()=>{});
    }
};
</script>

const db = firebase.database();

// Get URL params
function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
}
const subject = getParam('subject');
const quarter = getParam('quarter');
const name = getParam('name');
const mode = getParam('mode') || 'student'; // Default to student mode

// Setup Fabric canvas
    const canvas = new fabric.Canvas('presentation-canvas', {
        backgroundColor: '#fff',
        width: 1024,
        height: 768,
        selection: false
    });

// Make all objects unselectable and not editable for students
function lockCanvasObjects() {
    canvas.getObjects().forEach(obj => {
        obj.selectable = false;
        obj.evented = false;
        obj.hasControls = false;
        obj.hasBorders = false;
        if (obj.type === 'group' && obj._objects) {
            obj._objects.forEach(child => {
                child.selectable = false;
                child.evented = false;
                child.hasControls = false;
                child.hasBorders = false;
            });
        }
    });
    canvas.selection = false;
    canvas.discardActiveObject();
    canvas.renderAll();
}

let slides = [];
let currentSlide = 0;

// Create navigation UI for presentation
const navBar = document.createElement('div');
navBar.className = 'nav-bar';
navBar.innerHTML = `
    <button id="prev-slide-btn" class="nav-btn">
        <i class="fas fa-chevron-left"></i> Prev
    </button>
    <span id="slide-indicator" class="slide-indicator">Test 1/1</span>
    <button id="next-slide-btn" class="nav-btn">
        Next <i class="fas fa-chevron-right"></i>
    </button>
`;
document.body.appendChild(navBar);

// Navigation functions
function updateNavigationButtons() {
    const prevBtn = document.getElementById('prev-slide-btn');
    const nextBtn = document.getElementById('next-slide-btn');
    
    // Disable Prev if first slide or if current/previous test is already completed
    prevBtn.disabled = currentSlide === 0 || attemptedTests[currentSlide - 1] || attemptedTests[currentSlide];

    // Disable Next if last slide, or if current test is not yet completed
    nextBtn.disabled = currentSlide === slides.length - 1 || !attemptedTests[currentSlide];
}

function updateSlideIndicator() {
    document.getElementById('slide-indicator').textContent = `Test ${currentSlide+1}/${slides.length}`;
    updateNavigationButtons();
}

function setAspectRatioForSlide(slide) {
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    const canvasEl = document.getElementById('presentation-canvas');
    let ratio = '4 / 3';
    let width = 1024, height = 768;
    if (isGame1Slide(slide)) {
        ratio = '16 / 9';
        width = 1280;
        height = 720;
    }
    wrapper.style.aspectRatio = ratio;
    canvasEl.width = width;
    canvasEl.height = height;
    canvasEl.style.width = width + 'px';
    canvasEl.style.height = height + 'px';
}

function loadSlide(idx) {
    if (slides[idx]) {
        setAspectRatioForSlide(slides[idx]);
        canvas.loadFromJSON(slides[idx], function() {
            canvas.renderAll();
            lockCanvasObjects();
            showGameIframe(slides[currentSlide], document.getElementById('presentation-canvas'));
        });
    }
}

// Show game iframe if exists for the slide
function showGameIframe(slide, canvasEl) {
    let existing = document.getElementById('game-iframe');
    if (!slide.game || !slide.game.url) {
        if (existing) existing.remove();
        return;
    }
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    if (existing) existing.remove();

    // Set aspect ratio for game1
    setAspectRatioForSlide(slide);

    const rect = canvasEl.getBoundingClientRect();
    const iframe = document.createElement('iframe');
    iframe.id = 'game-iframe';
    iframe.src = slide.game.url;
    iframe.style.cssText = `
        position: absolute;
        top: ${canvasEl.offsetTop}px;
        left: ${canvasEl.offsetLeft}px;
        width: ${rect.width}px;
        height: ${rect.height}px;
        border: none;
        z-index: 10;
    `;
    iframe.allow = 'fullscreen';
    wrapper.style.position = 'relative';
    wrapper.appendChild(iframe);

    // Send custom quiz data to game
    iframe.onload = function() {
        setTimeout(() => {
            if (slide.game && slide.game.data) {
                let gameData = null;
                try {
                    gameData = typeof slide.game.data === 'string' ? JSON.parse(slide.game.data) : slide.game.data;
                } catch (e) {
                    console.error('Error parsing game data:', e);
                }
                if (gameData) {
                    iframe.contentWindow.postMessage({
                        type: 'loadQuizGameData',
                        gameData: gameData,
                        isTeacher: true
                    }, '*');
                }
            }
            iframe.contentWindow.postMessage({
                type: 'setTestIndex',
                index: currentSlide
            }, '*');
        }, 500);
    };
}

function listStudentQuizzes() {
    if (!subject || !quarter) {
        document.body.insertAdjacentHTML('beforeend', `
            <div style="color:white;text-align:center;margin-top:40px;padding:20px;background:rgba(255,255,255,0.1);border-radius:15px;">
                <h3>⚠️ Missing Parameters</h3>
                <p>Please specify both subject and quarter in the URL.</p>
                <code style="background:rgba(0,0,0,0.2);padding:8px;border-radius:8px;">
                    ?subject=subject_math&quarter=1
                </code>
            </div>
        `);
        return;
    }
    
    firebase.auth().onAuthStateChanged(async function(user) {
        if (!user) {
            document.body.insertAdjacentHTML('beforeend', `
                <div style="color:white;text-align:center;margin-top:40px;">
                    <h3>🔒 Please Log In</h3>
                    <p>You need to be logged in to view quizzes.</p>
                </div>
            `);
            return;
        }
        
        const studentUID = user.uid;
        
        try {
            // Check if user is a student
            const studentSnap = await db.ref('students/' + studentUID).once('value');
            if (!studentSnap.exists()) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;">
                        <h3>❌ Access Denied</h3>
                        <p>This page is for students only.</p>
                    </div>
                `);
                return;
            }
            
            // Load student's quizzes for this subject and quarter
            const quizzesSnap = await db.ref(`students/${studentUID}/quizzes/${subject}/${quarter}`).once('value');
            
            if (!quizzesSnap.exists()) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;padding:20px;background:rgba(255,255,255,0.1);border-radius:15px;">
                        <h3>📚 No Quizzes Available</h3>
                        <p>No quizzes found for this subject and quarter.</p>
                        <p><strong>Subject:</strong> ${subject.replace('subject_','').toUpperCase()}</p>
                        <p><strong>Quarter:</strong> ${quarter}</p>
                    </div>
                `);
                return;
            }
            
            const listDiv = document.createElement('div');
            listDiv.style = 'margin:40px auto 0 auto;max-width:700px;background:rgba(255,255,255,0.95);border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.1);backdrop-filter:blur(20px);';
            listDiv.innerHTML = `
                <h2 style="margin-top:0;color:#333;font-weight:700;font-size:1.8rem;text-align:center;margin-bottom:30px;">
                    📚 ${subject.replace('subject_','').toUpperCase()} Quizzes - Quarter ${quarter}
                </h2>
                <ul id="quiz-list" style="list-style:none;padding:0;margin:0;"></ul>
            `;
            document.body.appendChild(listDiv);
            
            const ul = document.getElementById('quiz-list');
            
            quizzesSnap.forEach(child => {
                const data = child.val();
                const li = document.createElement('li');
                li.style = 'margin-bottom:20px;padding:20px;border-radius:15px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);transition:all 0.3s ease;border-left:5px solid #667eea;';
                
                const isLocked = data.isLocked !== false;
                const createdDate = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : 'Unknown date';
                
                li.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                        <h3 style="margin:0;color:#333;font-size:1.2rem;flex:1;">
                            📋 ${data.title || child.key}
                        </h3>
                        <span style="background:${isLocked ? '#e74c3c' : '#27ae60'};color:white;padding:4px 8px;border-radius:12px;font-size:0.75rem;font-weight:600;">
                            ${isLocked ? '🔒 LOCKED' : '🔓 UNLOCKED'}
                        </span>
                    </div>
                    <p style="margin:0 0 12px 0;color:#666;font-size:0.95rem;">
                        ${data.description || 'No description available'}
                    </p>
                    <div style="font-size:0.85rem;color:#888;margin-bottom:15px;">
                        <span style="margin-right:15px;">👨‍🏫 ${data.teacherName || 'Teacher'}</span>
                        <span style="margin-right:15px;">📅 ${createdDate}</span>
                        ${data.attempts ? `<span style="margin-right:15px;">🎯 Attempts: ${data.attempts}</span>` : ''}
                        ${data.bestScore ? `<span>⭐ Best: ${data.bestScore}</span>` : ''}
                    </div>
                    ${isLocked ? 
                        `<button style="margin-top:12px;padding:10px 24px;border-radius:25px;border:none;background:#e74c3c;color:white;font-weight:600;cursor:pointer;transition:all 0.3s ease;" 
                            onclick="alert('This quiz is locked. Contact your teacher for the password.')">
                            🔒 Quiz Locked
                        </button>` :
                        `<button style="margin-top:12px;padding:10px 24px;border-radius:25px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-weight:600;cursor:pointer;transition:all 0.3s ease;" 
                            onmouseover="this.style.background='linear-gradient(135deg,#764ba2,#667eea)';this.style.transform='translateY(-2px)'" 
                            onmouseout="this.style.background='linear-gradient(135deg,#667eea,#764ba2)';this.style.transform='translateY(0)'"
                            onclick="window.location.href='quizView.html?subject=${encodeURIComponent(subject)}&quarter=${encodeURIComponent(quarter)}&name=${encodeURIComponent(child.key)}&mode=student'">
                            <i class="fas fa-play-circle"></i> View Quiz
                        </button>`
                    }
                `;
                ul.appendChild(li);
            });
        } catch (error) {
            console.error('Error loading student quizzes:', error);
            document.body.insertAdjacentHTML('beforeend', `
                <div style="color:white;text-align:center;margin-top:40px;">
                    <h3>⚠️ Error Loading Quizzes</h3>
                    <p>Unable to load quizzes. Please try again later.</p>

            `);

}

// Main logic - load specific quiz or show quiz list
if (!name) {
    // No specific quiz name provided, show list of available quizzes
    listStudentQuizzes();
} else {
    // Load specific quiz for student
    firebase.auth().onAuthStateChanged(async function(user) {
        if (!user || !subject || !quarter || !name) {
            document.body.insertAdjacentHTML('beforeend', `
                <div style="color:white;text-align:center;margin-top:40px;">
                    <h3>⚠️ Quiz Not Found</h3>
                    <p>Quiz not found or you're not logged in.</p>
                </div>
            `);
            return;
        }
        
        const studentUID = user.uid;
        
        try {
            // Check if user is a student
            const studentSnap = await db.ref('students/' + studentUID).once('value');
            if (!studentSnap.exists()) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;">
                        <h3>❌ Access Denied</h3>
                        <p>This page is for students only.</p>
                    </div>
                `);
                return;
            }
            
            // Load quiz from student's collection
            const quizSnap = await db.ref(`students/${studentUID}/quizzes/${subject}/${quarter}/${name}`).once('value');
            
            if (!quizSnap.exists()) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;">
                        <h3>📝 Quiz Not Available</h3>
                        <p>This quiz is not available to you or has been removed.</p>
                    </div>
                `);
                return;
            }
            
            const quizData = quizSnap.val();
            
            // Check if quiz is locked
            if (quizData.isLocked !== false) {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;padding:30px;background:rgba(231,76,60,0.1);border:2px solid #e74c3c;border-radius:15px;max-width:500px;margin-left:auto;margin-right:auto;">
                        <h3 style="color:#e74c3c;">🔒 Quiz Locked</h3>
                        <p>This quiz is currently locked.</p>
                        <p>Please contact your teacher to unlock it.</p>
                        <button onclick="window.history.back()" style="margin-top:15px;padding:10px 20px;background:#e74c3c;color:white;border:none;border-radius:8px;cursor:pointer;">
                            ← Go Back
                        </button>
                    </div>
                `);
                return;
            }
            
            // Load quiz slides
            if (quizData.slides) {
                slides = JSON.parse(quizData.slides);
                currentSlide = 0;
                loadSlide(currentSlide);
                updateSlideIndicator();
                
                
            } else {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;">
                        <h3>⚠️ Invalid Quiz</h3>

        } catch (error) {
            console.error('Error loading quiz:', error);
            document.body.insertAdjacentHTML('beforeend', `
                <div style="color:white;text-align:center;margin-top:40px;">
                    <h3>⚠️ Error Loading Quiz</h3>
                    <p>Unable to load quiz. Please try again later.</p>
                </div>
            `);
        }
    });
}

// Update navigation events to enforce rules
document.getElementById('next-slide-btn').onclick = function() {
    // Only allow next if current test is completed
    if (currentSlide < slides.length - 1 && attemptedTests[currentSlide]) {
        currentSlide++;
        loadSlide(currentSlide);
        updateSlideIndicator();
    }
};

document.getElementById('prev-slide-btn').onclick = function() {
    // Only allow prev if previous test is not completed and current is not completed
    if (
        currentSlide > 0 &&
        !attemptedTests[currentSlide - 1] && // Can't go back if previous is completed
        !attemptedTests[currentSlide]        // Can't go back if current is completed
    ) {
        currentSlide--;
        loadSlide(currentSlide);
        updateSlideIndicator();
    }
};

// Keyboard navigation
document.addEventListener('keydown', function(e) {
    switch(e.key) {
        case 'ArrowRight':
        case ' ': // Spacebar
            e.preventDefault();
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                loadSlide(currentSlide);
                updateSlideIndicator();
            }
            break;
        case 'ArrowLeft':
            e.preventDefault();
            if (currentSlide > 0) {
                currentSlide--;
                loadSlide(currentSlide);
                updateSlideIndicator();
            }
            break;
        case 'Home':
            e.preventDefault();
            currentSlide = 0;
            loadSlide(currentSlide);
            updateSlideIndicator();
            break;
        case 'End':
            e.preventDefault();
            currentSlide = slides.length - 1;
            loadSlide(currentSlide);
            updateSlideIndicator();
            break;
        case 'Escape':
            e.preventDefault();
            window.history.back();
            break;
    }
});

// Prevent context menu and interactions
document.getElementById('presentation-canvas').addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});

document.addEventListener('dragover', function(e) {
    e.preventDefault();
});

document.addEventListener('drop', function(e) {
    e.preventDefault();
});

// GIF overlay function
function overlayGifsOnCanvasPresent(canvas) {
    document.querySelectorAll('.canvas-gif-overlay').forEach(el => el.remove());
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    const canvasEl = document.getElementById('presentation-canvas');
    if (!wrapper || !canvasEl) return;

    const wrapperRect = wrapper.getBoundingClientRect();
    const canvasRect = canvasEl.getBoundingClientRect();
    const offsetLeft = canvasRect.left - wrapperRect.left;
    const offsetTop = canvasRect.top - wrapperRect.top;

    const scaleX = canvasEl.offsetWidth / canvasEl.width;
    const scaleY = canvasEl.offsetHeight / canvasEl.height;

    canvas.getObjects().forEach(obj => {
        if (
            obj.type === 'image' &&
            obj._element &&
            obj._element.src &&
            (obj._element.src.includes('.gif') || obj._element.src.startsWith('data:image/gif'))
        ) {
            const rect = obj.getBoundingRect();
            const left = rect.left * scaleX + offsetLeft;
            const top = rect.top * scaleY + offsetTop;
            const width = rect.width * scaleX;
            const height = rect.height * scaleY;

            const img = document.createElement('img');
            img.src = obj._element.src;
            img.className = 'canvas-gif-overlay';
            img.style.position = 'absolute';
            img.style.left = left + 'px';
            img.style.top = top + 'px';
            img.style.width = width + 'px';
            img.style.height = height + 'px';
            img.style.pointerEvents = 'none';
            img.style.zIndex = 50;
            wrapper.appendChild(img);
        }
    });
}

// Collect and save total scores for each test, then save overall quiz summary
let testScores = {}; // {slideIndex: {score, maxScore, answers, timestamp}}

// Track which tests have been attempted
let attemptedTests = {}; // {slideIndex: true}

// Listen for quiz results and enforce single attempt per test
window.addEventListener('message', function(event) {
  try {
    const msg = event.data || {};
    if (!msg || msg.type !== 'quizResult') return;

    const payload = msg.payload || {};
    const score = payload.score;
    const maxScore = payload.maxScore;
    const answers = payload.answers;
    const quizId = payload.quizId || getParam('quizId') || getParam('name') || 'unknown_quiz';
    const subject = getParam('subject') || 'unknown_subject';
    const quarter = getParam('quarter') || 'unknown_quarter';
    const slideIndex = typeof payload.slideIndex === 'number'
    ? payload.slideIndex
    : (typeof currentSlide === 'number' ? currentSlide : 0);

// Only first attempt per test
    if (attemptedTests[slideIndex]) return;
    attemptedTests[slideIndex] = true;
    testScores[slideIndex] = { score, maxScore, answers, timestamp: Date.now() };

    // Save to Firebase and update summary
    const user = firebase.auth().currentUser;
    if (user) {
      saveToStudentQuiz(user);
    }

    // Update navigation buttons after test completion
    updateNavigationButtons();

    // Now increment slide and load next
    setTimeout(() => {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        loadSlide(currentSlide);
        updateSlideIndicator();
      } else {
        // Show Done button and lock quiz
        let doneBtn = document.getElementById('quiz-done-btn');
        if (!doneBtn) {
          doneBtn = document.createElement('button');
          doneBtn.id = 'quiz-done-btn';
          doneBtn.textContent = 'Done';
          doneBtn.style = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:18px 48px;font-size:1.3rem;background:#27ae60;color:#fff;border:none;border-radius:18px;box-shadow:0 4px 24px rgba(39,174,96,0.18);font-weight:700;z-index:9999;cursor:pointer;';
          doneBtn.onclick = function() {
            // Lock quiz and prevent retake
            document.body.innerHTML += `<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;"><div style="background:#fff;padding:48px 60px;border-radius:24px;font-size:1.5rem;color:#222;font-weight:700;text-align:center;">Quiz Completed.<br>You cannot take this quiz again.</div></div>`;
            window.parent.postMessage({ type: 'quizClosed', quizId: quizId, timestamp: Date.now() }, '*');
            setTimeout(() => {
              // Go back to the previous page after 2 seconds
              window.location.href = document.referrer && document.referrer !== location.href ? document.referrer : 'homepage.html';
            }, 3000);
          };
          document.body.appendChild(doneBtn);
        }
        // Optionally disable navigation
        document.getElementById('next-slide-btn').disabled = true;
        document.getElementById('prev-slide-btn').disabled = true;
      }
    }, 700);

  } catch (e) {
    console.error('quizResult handler error', e);
  }
}, false);

// Save function for student quiz data
function saveToStudentQuiz(user) {
  const uid = user.uid;
  const quizId = getParam('name') || 'unknown_quiz';
  const subject = getParam('subject') || 'unknown_subject';
  const quarter = getParam('quarter') || 'unknown_quarter';

  Object.keys(testScores).forEach(slideIndex => {
    const scoreObj = testScores[slideIndex];
    // Attach gameUrl for this test
    scoreObj.gameUrl = slides[slideIndex]?.game?.url || null;
    db.ref(`students/${uid}/quizzes/${subject}/${quarter}/${quizId}/tests/${slideIndex}/score`).set(scoreObj);
    db.ref(`students/${uid}/quizzes/${subject}/${quarter}/${quizId}/tests/${slideIndex}/summary`).set({
      score: scoreObj.score,
      maxScore: scoreObj.maxScore,
      timestamp: scoreObj.timestamp,
      gameUrl: scoreObj.gameUrl
    });
  });

  const totalScore = Object.values(testScores).reduce((sum, t) => sum + t.score, 0);
  const totalMax = Object.values(testScores).reduce((sum, t) => sum + t.maxScore, 0);
  db.ref(`students/${uid}/quizzes/${subject}/${quarter}/${quizId}/summary`).set({
    totalScore,
    totalMax,
    completedAt: Date.now()
  });
}

// New function to detect Game 1 slides
function isGame1Slide(slide) {
    return slide && slide.game && slide.game.url && /game1\.html(\?|$)/.test(slide.game.url);
}


</script>
<script>
    function isFullscreen() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
}

// Responsive 4:3 canvas in fullscreen
function resizeCanvasTo4by3Responsive() {
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    const canvasEl = document.getElementById('presentation-canvas');
    if (!wrapper || !canvasEl) return;

    let ww = window.innerWidth;
    let wh = window.innerHeight;

    // Find the largest 4:3 that fits in the viewport
    let targetW = ww;
    let targetH = ww * 3 / 4;
    if (targetH > wh) {
        targetH = wh;
        targetW = wh * 4 / 3;
    }

    // Shrink the canvas for fullscreen (e.g. 70%)
    const scale = 0.1; // <--- adjust this value (0.7 = 70% of max possible)
    targetW *= scale;
    targetH *= scale;

    wrapper.style.width = targetW + 'px';
    wrapper.style.height = targetH + 'px';
    wrapper.style.display = 'flex';
    wrapper.style.alignItems = 'center';
    wrapper.style.justifyContent = 'center';
    wrapper.style.margin = 'auto';

    canvasEl.style.width = '100%';
    canvasEl.style.height = '100%';
    canvasEl.style.display = 'block';
    canvasEl.style.margin = '0';

    // Resize the Fabric.js logical canvas to match the display size
    if (window.canvas && window.canvas.setDimensions) {
        window.canvas.setDimensions({
            width: targetW,
            height: targetH
        }, { cssOnly: false });
        window.canvas.calcOffset && window.canvas.calcOffset();
        window.canvas.renderAll && window.canvas.renderAll();
    }
}


function restoreCanvasFromFullscreen() {
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    const canvas = document.getElementById('presentation-canvas');
    if (!wrapper || !canvas) return;
    wrapper.removeAttribute('style');
    canvas.removeAttribute('style');
    // Restore fabric.js canvas to original size
    if (window.canvas && window.canvas.setDimensions) {
        window.canvas.setDimensions({ width: 1024, height: 768 });
        window.canvas.calcOffset && window.canvas.calcOffset();
        window.canvas.renderAll && window.canvas.renderAll();
    }
}

document.getElementById('fullscreen-btn').onclick = function() {
    const wrapper = document.querySelector('.presentation-canvas-wrapper');
    if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
    } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
    } else if (wrapper.msRequestFullscreen) {
        wrapper.msRequestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(()=>{});
    }
    setTimeout(resizeCanvasTo4by3Responsive, 300);
};

window.addEventListener('resize', function() {
    if (isFullscreen()) resizeCanvasTo4by3Responsive();
});
document.addEventListener('fullscreenchange', function() {
    if (isFullscreen()) {
        resizeCanvasTo4by3Responsive();
    } else {
        restoreCanvasFromFullscreen();
    }
});
document.addEventListener('webkitfullscreenchange', function() {
    if (isFullscreen()) {
        resizeCanvasTo4by3Responsive();
    } else {
        restoreCanvasFromFullscreen();
    }
});
document.addEventListener('msfullscreenchange', function() {
    if (isFullscreen()) {
        resizeCanvasTo4by3Responsive();
    } else {
        restoreCanvasFromFullscreen();
    }
});
</script>
