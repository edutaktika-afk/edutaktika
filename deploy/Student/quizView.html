<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Quiz View</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="../CSS/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #222;
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            min-width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .presentation-canvas-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(1024px, 95vw);
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(2,6,23,0.6);
            margin: 0 auto;
        }
        #presentation-canvas {
            width: 1024px;
            height: 768px;
            max-height: 100vh;
            display: block;
            object-fit: contain;
        }
        #game-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 10;
        }
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
        }
        @media (max-width: 640px) {
            .presentation-canvas-wrapper { width: calc(100vw - 24px); }
        }
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        html {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        @media (max-width: 900px) {
            .presentation-canvas-wrapper {
                width: 100vw !important;
                max-width: 100vw !important;
                aspect-ratio: 4 / 3 !important;
                margin: 0 !important;
                left: 0 !important;
                right: 0 !important;
                border-radius: 0 !important;
            }
            #presentation-canvas {
                width: 100vw !important;
                max-width: 100vw !important;
                height: auto !important;
                max-height: 100vw !important;
                display: block;
                margin: 0 auto;
            }
            #game-iframe {
                width: 100vw !important;
                max-width: 100vw !important;
                height: 100% !important;
                left: 0 !important;
                right: 0 !important;
            }
        }
        @media (max-width: 600px) {
            .presentation-canvas-wrapper {
                width: 100vw !important;
                max-width: 100vw !important;
                aspect-ratio: 4 / 3 !important;
                margin: 0 !important;
                left: 0 !important;
                right: 0 !important;
                border-radius: 0 !important;
            }
            #presentation-canvas {
                width: 100vw !important;
                max-width: 100vw !important;
                height: auto !important;
                max-height: 100vw !important;
                display: block;
                margin: 0 auto;
            }
            #game-iframe {
                width: 100vw !important;
                max-width: 100vw !important;
                height: 100% !important;
                left: 0 !important;
                right: 0 !important;
            }
        }
        @media (max-width: 700px) {
            #game-iframe[src*="game3.html"] {
                transform: scale(0.85);
                transform-origin: top center;
                height: 100%;
                width: 100%;
            }
        }
        @media (max-width: 500px) {
            #game-iframe[src*="game3.html"] {
                transform: scale(0.7);
            }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            :fullscreen #game-iframe[src*="game3.html"],
            :-webkit-full-screen #game-iframe[src*="game3.html"] {
                transform: none !important;
            }
        }
        @media (max-width: 700px) and (orientation: landscape) {
            :fullscreen #game-iframe[src*="game3.html"],
            :-webkit-full-screen #game-iframe[src*="game3.html"] {
                transform: none !important;
            }
        }
        @media (orientation: landscape) {
            :fullscreen .presentation-canvas-wrapper,
            :-webkit-full-screen .presentation-canvas-wrapper {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                aspect-ratio: unset !important;
                border-radius: 0 !important;
                left: 0; right: 0; top: 0; bottom: 0;
                margin: 0 !important;
                background: #222 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            :fullscreen #game-iframe,
            :-webkit-full-screen #game-iframe {
                position: absolute !important;
                top: 0; left: 0;
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                transform: none !important;
                background: #222 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                margin: 0 !important;
                display: block !important;
            }
        }
        @media (orientation: landscape) {
            :fullscreen .presentation-canvas-wrapper,
            :-webkit-full-screen .presentation-canvas-wrapper {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                aspect-ratio: unset !important;
                border-radius: 0 !important;
                left: 0; right: 0; top: 0; bottom: 0;
                margin: 0 !important;
                background: #222 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            :fullscreen #game-iframe[src*="game3.html"],
            :-webkit-full-screen #game-iframe[src*="game3.html"] {
                position: absolute !important;
                top: 0; left: 0;
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                transform: none !important;
                background: #222 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                margin: 0 !important;
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.history.back()">
        <i class="fas fa-arrow-left"></i> Back
    </button>
    <div class="presentation-canvas-wrapper">
        <canvas id="presentation-canvas"></canvas>
    </div>
    <button id="fullscreen-btn" style="
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 200;
        background: #222;
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        font-size: 1.5em;
        box-shadow: 0 2px 8px #0003;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    ">
        <i class="fas fa-expand"></i>
    </button>
    <script>
    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyB5BbeLLvPX8l1c4Lq0f-CmIUml4hQOQlE",
        authDomain: "edutaktika.firebaseapp.com",
        databaseURL: "https://edutaktika-default-rtdb.firebaseio.com",
        projectId: "edutaktika",
        storageBucket: "edutaktika.appspot.com",
        messagingSenderId: "676848575316",
        appId: "1:676848575316:web:f78f8c0f83bf3d9dfb5ec1",
        measurementId: "G-X3GT5TNN87"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Get URL params
    function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    const subject = getParam('subject');
    const quarter = getParam('quarter');
    const name = getParam('name');
    const mode = 'student';

    // Setup Fabric canvas
    const canvas = new fabric.Canvas('presentation-canvas', {
        backgroundColor: '#fff',
        width: 1024,
        height: 768,
        selection: false
    });

    function lockCanvasObjects() {
        canvas.getObjects().forEach(obj => {
            obj.selectable = false;
            obj.evented = false;
            obj.hasControls = false;
            obj.hasBorders = false;
            if (obj.type === 'group' && obj._objects) {
                obj._objects.forEach(child => {
                    child.selectable = false;
                    child.evented = false;
                    child.hasControls = false;
                    child.hasBorders = false;
                });
            }
        });
        canvas.selection = false;
        canvas.discardActiveObject();
        canvas.renderAll();
    }

    let slides = [];
    let currentSlide = 0;

    function setAspectRatioForSlide(slide) {
        const wrapper = document.querySelector('.presentation-canvas-wrapper');
        const canvasEl = document.getElementById('presentation-canvas');
        let ratio = '4 / 3';
        if (isGame1Slide(slide)) {
            ratio = '16 / 9';
        }
        wrapper.style.aspectRatio = ratio;

        // Responsive: set canvas size based on wrapper's size
        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            canvasEl.width = rect.width;
            canvasEl.height = rect.height;
            canvasEl.style.width = rect.width + 'px';
            canvasEl.style.height = rect.height + 'px';
            canvas.setWidth(rect.width);
            canvas.setHeight(rect.height);
            canvas.renderAll();
        }
        if (!wrapper._resizeObserver) {
            wrapper._resizeObserver = new ResizeObserver(resizeCanvas);
            wrapper._resizeObserver.observe(wrapper);
        }
        setTimeout(resizeCanvas, 10);
    }

    function loadSlide(idx) {
        if (slides[idx]) {
            setAspectRatioForSlide(slides[idx]);
            canvas.loadFromJSON(slides[idx], function() {
                canvas.renderAll();
                lockCanvasObjects();
                showGameIframe(slides[currentSlide], document.getElementById('presentation-canvas'));
            });
        }
    }

    function showGameIframe(slide, canvasEl) {
        let existing = document.getElementById('game-iframe');
        if (!slide.game || !slide.game.url) {
            if (existing) existing.remove();
            return;
        }
        const wrapper = document.querySelector('.presentation-canvas-wrapper');
        if (existing) existing.remove();

        // Set aspect ratio for game1
        setAspectRatioForSlide(slide);

        const rect = canvasEl.getBoundingClientRect();
        const iframe = document.createElement('iframe');
        iframe.id = 'game-iframe';
        iframe.src = slide.game.url;
        iframe.style.cssText = `
            position: absolute;
            top: ${canvasEl.offsetTop}px;
            left: ${canvasEl.offsetLeft}px;
            width: ${rect.width}px;
            height: ${rect.height}px;
            border: none;
            z-index: 10;
        `;
        iframe.allow = 'fullscreen';
        wrapper.style.position = 'relative';
        wrapper.appendChild(iframe);

        // Send custom quiz data to game
        iframe.onload = function() {
            setTimeout(() => {
                if (slide.game && slide.game.data) {
                    let gameData = null;
                    try {
                        gameData = typeof slide.game.data === 'string' ? JSON.parse(slide.game.data) : slide.game.data;
                    } catch (e) {
                        console.error('Error parsing game data:', e);
                    }
                    if (gameData) {
                        iframe.contentWindow.postMessage({
                            type: 'loadQuizGameData',
                            gameData: gameData,
                            isTeacher: false
                        }, '*');
                    }
                }
                iframe.contentWindow.postMessage({
                    type: 'setTestIndex',
                    index: currentSlide
                }, '*');
            }, 500);
        };
    }

    function isGame1Slide(slide) {
        return slide && slide.game && slide.game.url && /game1\.html(\?|$)/.test(slide.game.url);
    }

    // Load student's quiz data
    firebase.auth().onAuthStateChanged(async function(user) {
        if (!user || !subject || !quarter || !name) {
            document.body.insertAdjacentHTML('beforeend', `
                <div style="color:white;text-align:center;margin-top:40px;">
                    <h3>⚠️ Quiz Not Found</h3>
                    <p>Quiz not found or you're not logged in.</p>
                </div>
            `);
            return;
        }

        const studentUID = user.uid;

        db.ref('students/' + studentUID + '/quizzes/' + subject + '/' + quarter + '/' + name).once('value', function(snapshot) {
            if (snapshot.exists() && snapshot.val().slides) {
                slides = JSON.parse(snapshot.val().slides);
                currentSlide = 0;
                loadSlide(currentSlide);
                // updateSlideIndicator(); // If you have slide indicators for students
            } else if (snapshot.exists() && snapshot.val().json) {
                canvas.loadFromJSON(snapshot.val().json, function() {
                    canvas.renderAll();
                    slides = [canvas.toJSON()];
                    currentSlide = 0;
                    // updateSlideIndicator();
                });
            } else {
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="color:white;text-align:center;margin-top:40px;">
                        <h3>📝 Quiz Not Available</h3>
                        <p>This quiz is not available to you or has been removed.</p>
                    </div>
                `);
            }
        });
    });

    // Fullscreen mode for landscape/mobile
    document.getElementById('fullscreen-btn').onclick = function() {
        const wrapper = document.querySelector('.presentation-canvas-wrapper');
        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }
        if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen().then(lockLandscape).catch(lockLandscape);
        } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
            lockLandscape();
        } else if (wrapper.msRequestFullscreen) {
            wrapper.msRequestFullscreen();
            lockLandscape();
        }
    };

    // Arrow key navigation for slides
    document.addEventListener('keydown', function(e) {
        if (!slides.length) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                loadSlide(currentSlide);
            }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            if (currentSlide > 0) {
                currentSlide--;
                loadSlide(currentSlide);
            }
        }
    });

    // Track scores and attempted tests
    let testScores = {}; // {slideIndex: {score, maxScore, answers, timestamp}}
    let attemptedTests = {}; // {slideIndex: true}

    // Listen for quiz/game result messages from the iframe
    window.addEventListener('message', function(event) {
        try {
            const msg = event.data || {};
            if (!msg || msg.type !== 'quizResult') return;

            const payload = msg.payload || {};
            const score = payload.score;
            const maxScore = payload.maxScore;
            const answers = payload.answers;
            const slideIndex = typeof payload.slideIndex === 'number'
                ? payload.slideIndex
                : (typeof currentSlide === 'number' ? currentSlide : 0);

            // Only first attempt per test
            if (attemptedTests[slideIndex]) return;
            attemptedTests[slideIndex] = true;
            testScores[slideIndex] = { score, maxScore, answers, timestamp: Date.now() };

            // Save to Firebase (if logged in)
            const user = firebase.auth().currentUser;
            if (user) {
                saveToStudentQuiz(user);
            }

            // Automatically go to next test if not last
            setTimeout(() => {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    loadSlide(currentSlide);
                    updateSlideIndicator();
                } else {
                    // Show quiz completion message
                    let doneBtn = document.getElementById('quiz-done-btn');
                    if (!doneBtn) {
                        doneBtn = document.createElement('button');
                        doneBtn.id = 'quiz-done-btn';
                        doneBtn.textContent = 'Done';
                        doneBtn.style = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:18px 48px;font-size:1.3rem;background:#27ae60;color:#fff;border:none;border-radius:18px;box-shadow:0 4px 24px rgba(39,174,96,0.18);font-weight:700;z-index:9999;cursor:pointer;';
                        doneBtn.onclick = function() {
                            document.body.innerHTML += `<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;"><div style="background:#fff;padding:48px 60px;border-radius:24px;font-size:1.5rem;color:#222;font-weight:700;text-align:center;">Quiz Completed.<br>You cannot take this quiz again.</div></div>`;
                            setTimeout(() => {
                                window.location.href = document.referrer && document.referrer !== location.href ? document.referrer : 'homepage.html';
                            }, 3000);
                        };
                        document.body.appendChild(doneBtn);
                    }
                    // Optionally disable navigation
                    document.getElementById('next-slide-btn').disabled = true;
                    document.getElementById('prev-slide-btn').disabled = true;
                }
            }, 700);

        } catch (e) {
            console.error('quizResult handler error', e);
        }
    }, false);

    // Save function for student quiz data
    function saveToStudentQuiz(user) {
        const uid = user.uid;
        const quizId = getParam('name') || 'unknown_quiz';
        const subject = getParam('subject') || 'unknown_subject';
        const quarter = getParam('quarter') || 'unknown_quarter';

        Object.keys(testScores).forEach(slideIndex => {
            const scoreObj = testScores[slideIndex];
            scoreObj.gameUrl = slides[slideIndex]?.game?.url || null;
            db.ref(`students/${uid}/quizzes/${subject}/${quarter}/${quizId}/tests/${slideIndex}/score`).set(scoreObj);
            db.ref(`students/${uid}/quizzes/${subject}/${quarter}/${quizId}/tests/${slideIndex}/summary`).set({
                score: scoreObj.score,
                maxScore: scoreObj.maxScore,
                timestamp: scoreObj.timestamp,
                gameUrl: scoreObj.gameUrl
            });
        });

        const totalScore = Object.values(testScores).reduce((sum, t) => sum + t.score, 0);
        const totalMax = Object.values(testScores).reduce((sum, t) => sum + t.maxScore, 0);
        db.ref(`students/${uid}/quizzes/${subject}/${quarter}/${quizId}/summary`).set({
            totalScore,
            totalMax,
            completedAt: Date.now()
        });
    }
    </script>
</body>
</html>
