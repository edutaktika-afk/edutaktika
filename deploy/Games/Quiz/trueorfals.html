<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math True or False Game</title>
    <style>
        :root {
            --primary: #2e8b57;
            --secondary: #ffd700;
            --peach: #ff69b4;
            --forest-green: #3f4d34;
            --sun-yellow: #ffd700;
            --white: #ffffff;
        }
        body {
            font-family: 'Comic Neue', Arial, sans-serif;
            background: var(--primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 4px 24px var(--peach);
            padding: 32px 32px 40px;
            text-align: center;
            max-width: 440px;
            width: 96vw;
            position: relative;
        }
        /* top bar / progress */
        .top-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
        #progress { color:var(--forest-green); font-weight:700; font-size:0.95rem; }
        .hint { font-size:0.82rem; color:#666; }

        .question {
            font-size: 1.6rem;
            margin: 26px 0 28px;
            color: var(--forest-green);
            font-weight: bold;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn {
            padding: 14px 44px;
            border-radius: 10px;
            background: var(--secondary);
            color: var(--forest-green);
            border: 0;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--peach);
            transition: .2s;
            position: relative; /* allow checkmark pseudo */
        }
        .btn:hover {
            background: var(--peach);
            color: var(--white);
        }
        /* Selected option styling */
        .btn.selected {
            outline: 3px solid rgba(46,139,87,0.18);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46,139,87,0.12);
        }
        /* visible check badge on selected option */
        .btn.selected::after{
            content: "✓";
            position: absolute;
            right: 10px;
            top: 6px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-size:0.9rem;
        }

        #feedback {
            font-size: 1.15rem;
            margin: 16px 0 8px;
            min-height: 28px;
        }
        /* Edit button prominent style (visible only in editor mode) */
        .edit-open-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(90deg,#ffb86b,#ff6b6b);
            color: #112;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 6px 22px rgba(255,107,107,0.18);
            display: inline-flex;
            gap:8px;
            align-items:center;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;
            z-index: 5000;
        }
        .edit-open-btn .dot {
            width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0.06);
        }
        .edit-open-btn.pulse { animation: pulse 1.7s infinite; }
        @keyframes pulse { 0%{ transform: translateY(0);}50%{ transform: translateY(-3px);}100%{ transform: translateY(0);} }

        #final-modal, #edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 100000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #final-modal > div, #edit-modal > div {
            background: #fff;
            padding: 42px 40px 46px;
            border-radius: 18px;
            max-width: 520px;
            width: 96vw;
            box-shadow: 0 4px 30px -4px var(--peach);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 92vh;
            overflow: auto;
        }
        #play-again-btn {
            padding: 16px 42px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            border: 0;
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
        }
        #next-btn {
            display: none;
            margin-top: 8px;
            background: var(--primary);
            color: #fff;
            border: 0;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px -3px rgba(0, 0, 0, .3);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .small-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fff;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            font-size: .85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .small-btn:hover {
            background: var(--primary);
            color: #fff;
        }
        .edit-list-row {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .edit-list-row:last-child {
            border-bottom: 0;
        }
        .edit-list-row input[type=text] {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #cfd9e2;
            border-radius: 6px;
            font-size: .9rem;
        }
        .edit-list-row select {
            padding: 8px 10px;
            border: 1px solid #cfd9e2;
            border-radius: 6px;
        }
        .edit-list-row button {
            background: #ff5f5f;
            color: #fff;
            border: 0;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: .7rem;
            cursor: pointer;
        }
        #add-question-btn {
            background: var(--primary);
            color: #fff;
            border: 0;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: .85rem;
        }
        #save-questions-btn {
            background: var(--peach);
            color: #fff;
            border: 0;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: .95rem;
        }
        .status-msg {
            font-size: .8rem;
            min-height: 16px;
            color: #2e8b57;
            text-align: left;
        }
        /* (optional) hide feedback area completely */
        #feedback{display:none}
    </style>
</head>
<body>
  <div class="game-container">
    <button id="edit-open-btn" class="small-btn">Edit</button>
    <h2 style="color:var(--primary);margin:0;">Math True or False</h2>

    <!-- Add this inside .game-container, just above the .question div -->
    <div class="top-bar" style="justify-content: center; margin-top: 5px;">
      <span id="progress"></span>
    </div>

    <div class="question" id="question"></div>
    <button class="btn" id="true-btn">True</button>
    <button class="btn" id="false-btn">False</button>
    <div id="feedback"></div>
    <div style="display:flex;justify-content:center;gap:12px;margin-top:10px;">
      <button id="prev-btn" style="display:none;background:#e4edf4;color:#174369;border:0;padding:12px 28px;border-radius:12px;font-size:1.1rem;font-weight:600;">Previous</button>
      <button id="next-btn" style="display:none;background:var(--primary);color:#fff;border:0;padding:12px 28px;font-size:1.1rem;font-weight:600;border-radius:12px;">Next</button>
    </div>
    <button id="done-btn" style="display:none;background:var(--primary);color:#fff;border:0;padding:14px 44px;font-size:1.25rem;font-weight:bold;border-radius:12px;margin-top:18px;box-shadow:0 4px 14px -3px rgba(0,0,0,.3);cursor:pointer;">Done</button>
  </div>



  <!-- EDIT MODAL -->
  <div id="edit-modal" aria-hidden="true">
    <div>
      <h3 style="margin:0;font-size:1.4rem;color:var(--primary);">Edit Questions</h3>
      <div id="edit-list"></div>
      <div class="status-msg" id="edit-status"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="add-question-btn">Add Question</button>
        <button id="save-questions-btn">Save & Close</button>
        <button id="edit-cancel-btn" style="background:#ddd;color:#222;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem">Cancel</button>
      </div>
    </div>
  </div>

<script>
const LS_KEY='tf_quiz_questions_v1';
let questions = [
  { q: "7 + 5 = 12", answer: true },
  { q: "9 - 4 = 6", answer: false },
  { q: "3 × 3 = 9", answer: true },
  { q: "15 ÷ 5 = 2", answer: false },
  { q: "8 + 2 = 10", answer: true }
];
try{
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(Array.isArray(saved)&&saved.length && saved.every(x=>typeof x.q==='string' && typeof x.answer==='boolean')) questions=saved;
}catch(e){}

let current = 0;
let score = 0;
let answeredCurrent = false;
let userAnswers = []; // NEW: store student selections
let parentTestIndex = 0;

const qEl = document.getElementById('question');
const feedbackEl = document.getElementById('feedback');
const trueBtn = document.getElementById('true-btn');
const falseBtn = document.getElementById('false-btn');
const nextBtn = document.getElementById('next-btn');
const prevBtn = document.getElementById('prev-btn');
const finalModal = document.getElementById('final-modal');
const finalScore = document.getElementById('final-score');
const progressEl = document.getElementById('progress');
const doneBtn = document.getElementById('done-btn');

window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'setTestIndex') {
    parentTestIndex = event.data.index;
  }
});

function loadQuestion(){
  const q = questions[current];
  qEl.textContent = q ? q.q : '';
  feedbackEl.textContent='';
  answeredCurrent=false;
  // Show progress (e.g. "Question 2 of 5")
  progressEl.textContent = `Question ${current + 1} of ${questions.length}`;
  // hide Next unless a choice is made and not on last question
  nextBtn.style.display = (typeof userAnswers[current] !== 'undefined' && current < questions.length - 1) ? 'inline-block' : 'none';
  prevBtn.style.display = (current > 0) ? 'inline-block' : 'none';
  // Show Done button only on last question and if answered
  doneBtn.style.display = (current === questions.length - 1 && typeof userAnswers[current] !== 'undefined') ? 'inline-block' : 'none';
  enableAnswerButtons(true);
  updateSelectionUI();
}

// enable or disable answer buttons
function enableAnswerButtons(on){
  trueBtn.disabled=!on;
  falseBtn.disabled=!on;
  trueBtn.style.opacity= on? '1':'0.55';
  falseBtn.style.opacity= on? '1':'0.55';
}

// update visual selection state for current question
function updateSelectionUI(){
  const sel = userAnswers[current];
  if(sel === true){
    trueBtn.classList.add('selected');
    falseBtn.classList.remove('selected');
  } else if(sel === false){
    falseBtn.classList.add('selected');
    trueBtn.classList.remove('selected');
  } else {
    trueBtn.classList.remove('selected');
    falseBtn.classList.remove('selected');
  }
}

function checkAnswer(ans){
  // allow changing selection until user moves to next question
  userAnswers[current] = ans;
  answeredCurrent = true;
  // Show Next only if not on last question
  nextBtn.style.display = (current < questions.length - 1) ? 'inline-block' : 'none';
  // Show Done button if on last question
  if(current === questions.length - 1) {
    doneBtn.style.display = 'inline-block';
  }
  enableAnswerButtons(true);
  updateSelectionUI();
}

trueBtn.onclick=()=>checkAnswer(true);
falseBtn.onclick=()=>checkAnswer(false);

nextBtn.onclick=()=>{
  if(typeof userAnswers[current] === 'undefined' || userAnswers[current] === null) return;
  current++;
  if(current < questions.length){
    loadQuestion();
  }
  // No else: do nothing on last question, no modal, no play again
};

prevBtn.onclick = () => {
  if (current > 0) {
    current--;
    loadQuestion();
  }
};

/* ---------- EDIT FEATURE ---------- */
const editModal = document.getElementById('edit-modal');
const editOpenBtn = document.getElementById('edit-open-btn');
const editList = document.getElementById('edit-list');
const editStatus = document.getElementById('edit-status');
const addQuestionBtn = document.getElementById('add-question-btn');
const saveQuestionsBtn = document.getElementById('save-questions-btn');
const editCancelBtn = document.getElementById('edit-cancel-btn');

editOpenBtn.addEventListener('click', openEditor);
editCancelBtn.addEventListener('click',closeEditor);
addQuestionBtn.addEventListener('click',()=> addRow('',true));

saveQuestionsBtn.addEventListener('click', saveEditorQuestions);

function openEditor(){
  editList.innerHTML='';
  questions.forEach(q=> addRow(q.q,q.answer));
  editStatus.textContent='';
  editModal.style.display='flex';
  editModal.setAttribute('aria-hidden','false');
}

function closeEditor(){
  editModal.style.display='none';
  editModal.setAttribute('aria-hidden','true');
}

function addRow(text='',ans=true){
  const row=document.createElement('div');
  row.className='edit-list-row';
  row.innerHTML=`
    <input type="text" class="row-text" placeholder="Question text" value="${escapeHtml(text)}">
    <select class="row-ans">
      <option value="true" ${ans?'selected':''}>True</option>
      <option value="false" ${!ans?'selected':''}>False</option>
    </select>
    <button type="button" class="del">X</button>
  `;
  row.querySelector('.del').addEventListener('click',()=> row.remove());
  editList.appendChild(row);
}

function saveEditorQuestions(){
  const rows=[...editList.querySelectorAll('.edit-list-row')];
  const newQs=[];
  for(const r of rows){
    const txt=r.querySelector('.row-text').value.trim();
    if(!txt){ editStatus.style.color='#c0392b'; editStatus.textContent='Empty question found.'; return; }
    const ans=r.querySelector('.row-ans').value==='true';
    newQs.push({q:txt,answer:ans});
  }
  if(!newQs.length){ editStatus.style.color='#c0392b'; editStatus.textContent='Add at least one question.'; return; }
  questions=newQs;
  localStorage.setItem(LS_KEY, JSON.stringify(questions));
  // Reset game
  current=0; score=0;
  loadQuestion();
  editStatus.style.color='var(--primary)';
  editStatus.textContent='Saved!';
  setTimeout(closeEditor,450);
}

/* Utility to escape user-entered text */
function escapeHtml(s){
  return s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[ch]));
}

/* Init */
loadQuestion();

/* ---------- EDIT BUTTON VISIBILITY: show ONLY when opened from quizEditor or explicitly allowed ---------- */
;(function controlEditButtonVisibility(){
  const editOpenBtn = document.getElementById('edit-open-btn');
  if (!editOpenBtn) return;

  function show() { editOpenBtn.style.display = ''; }
  function hide() { editOpenBtn.style.display = 'none'; }

  // default: hide for both teacher/student quizView
  hide();

  try {
    const params = new URLSearchParams(location.search);
    const explicitEditor = params.get('editor') === 'true' || params.get('edit') === 'true' || params.get('mode') === 'edit';

    // If explicitly opened in editor mode via URL, show
    if (explicitEditor) { show(); return; }

    // If referrer contains "quizeditor" (best-effort), show
    if (document.referrer && document.referrer.toLowerCase().includes('quizeditor')) { show(); return; }

    // Try to detect opener/parent (may throw cross-origin) — show only if it appears to be the quizEditor
    try {
      if (window.parent && window.parent !== window && String(window.parent.location.href).toLowerCase().includes('quizeditor')) { show(); return; }
    } catch (e) { /* ignore cross-origin */ }
    try {
      if (window.opener && String(window.opener.location.href).toLowerCase().includes('quizeditor')) { show(); return; }
    } catch (e) { /* ignore cross-origin */ }

  } catch (e) {
    // keep hidden on any error
    console.warn('controlEditButtonVisibility error', e);
  }

  // Allow parent to override visibility via postMessage:
  // { type: 'allowEdit', allow: true }  -> show
  // { type: 'hideEditUI' }              -> hide
  window.addEventListener('message', (ev) => {
    try {
      const d = ev.data || {};
      if (d && d.type === 'allowEdit' && d.allow === true) show();
      if (d && d.type === 'hideEditUI') hide();
    } catch (err) { /* ignore */ }
  }, false);

  // Ensure the edit button still opens editor if visible
  editOpenBtn.addEventListener('click', (e) => {
    // if hidden do nothing
    if (getComputedStyle(editOpenBtn).display === 'none') return;
    openEditor();
  });
})();
  
doneBtn.onclick = () => {
  // Calculate score
  let score = 0;
  for (let i = 0; i < questions.length; i++) {
    if (userAnswers[i] === questions[i].answer) score++;
  }
  // Send result to parent for saving in Firebase
  window.parent.postMessage({
    type: 'quizResult',
    payload: {
      score: score,
      maxScore: questions.length,
      answers: userAnswers,
      quizId: window.location.pathname.split('/').pop(),
      slideIndex: parentTestIndex // <-- Always use this!
    }
  }, '*');
  // Optionally disable the button or show a message
  doneBtn.disabled = true;
  doneBtn.textContent = "Submitted!";
};
</script>
</body>
</html>
