<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Picture Quiz: Guess the Animal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4fa; margin: 0; }
    #game-container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px #0002;
      padding: 32px 24px;
      width: 90vw;
      text-align: center;
    }
    #question {
      font-size: 1.3em;
      margin-bottom: 18px;
    }
    #animal-img {
      width: 400px;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #4f8cff;
      background: #fff;
      margin-bottom: 28px;
      max-width: 95vw;
    }
    .option-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 32px;
      margin-bottom: 32px;
    }
    .option {
      background: #eaf6fb;
      border: 2px solid #4f8cff;
      border-radius: 10px;
      padding: 24px 36px;
      font-size: 1.2em;
      color: #4f8cff;
      cursor: pointer;
      min-width: 120px;
      min-height: 60px;
      transition: background 0.2s, border 0.2s, color 0.2s;
      box-shadow: 0 2px 8px #0001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option.selected {
      background: #d1e7dd;
      border-color: #198754;
      color: #198754;
    }
    .option.incorrect {
      background: #f8d7da;
      border-color: #dc3545;
      color: #dc3545;
    }
    .option.correct {
      background: #cfe2ff;
      border-color: #0d6efd;
      color: #0d6efd;
    }
    #next-btn {
      margin-top: 32px;
      padding: 14px 36px;
      font-size: 1.1em;
      border: none;
      border-radius: 8px;
      background: #4f8cff;
      color: #fff;
      cursor: pointer;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    #next-btn:disabled { background: #ccc; cursor: not-allowed; }
    #score, #result { text-align: center; font-size: 1.2em; margin-top: 28px; }
    @media (max-width: 700px) {
      #game-container { width: 99vw; min-width: 0; padding: 8px 2vw; }
      .option-list { gap: 12px; }
      .option { font-size: 1em; padding: 14px 10px; min-width: 70px; min-height: 40px; }
      #animal-img { width: 98vw; height: 140px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="question">What animal is this?</div>
    <img id="animal-img" src="" alt="Animal">
    <div class="option-list" id="options"></div>
    <button id="next-btn" disabled>Next</button>
    <div id="score"></div>
    <div id="result"></div>
  </div>
  <script>
    // Picture quiz data: Guess the animal from the image
    const quiz = [
      {
        image: "https://upload.wikimedia.org/wikipedia/commons/7/73/Lion_waiting_in_Namibia.jpg",
        options: ["Tiger", "Lion", "Leopard", "Cheetah"],
        answer: 1
      },
      {
        image: "https://upload.wikimedia.org/wikipedia/commons/1/1a/Bald_Eagle_Portrait.jpg",
        options: ["Hawk", "Owl", "Bald Eagle", "Falcon"],
        answer: 2
      },
      {
        image: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg",
        options: ["Cat", "Dog", "Wolf", "Fox"],
        answer: 1
      },
      {
        image: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg",
        options: ["Rabbit", "Cat", "Squirrel", "Hamster"],
        answer: 1
      }
    ];

    let current = 0;
    let score = 0;
    let selected = null;

    const questionEl = document.getElementById('question');
    const imgEl = document.getElementById('animal-img');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');

    function showQuestion() {
      const q = quiz[current];
      imgEl.src = q.image;
      imgEl.style.display = '';
      optionsEl.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => selectOption(idx, btn);
        optionsEl.appendChild(btn);
      });
      nextBtn.disabled = true;
      scoreEl.textContent = `Score: ${score} / ${quiz.length}`;
      resultEl.textContent = '';
      selected = null;
    }

    function selectOption(idx, btn) {
      if (selected !== null) return;
      selected = idx;
      const q = quiz[current];
      const optionDivs = optionsEl.querySelectorAll('.option');
      optionDivs.forEach((div, i) => {
        div.classList.remove('selected', 'incorrect', 'correct');
        if (i === q.answer) div.classList.add('correct');
        if (i === idx && idx !== q.answer) div.classList.add('incorrect');
        if (i === idx && idx === q.answer) div.classList.add('selected');
      });
      if (idx === q.answer) score++;
      nextBtn.disabled = false;
    }

    nextBtn.onclick = () => {
      current++;
      if (current < quiz.length) {
        showQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      questionEl.textContent = '';
      imgEl.style.display = 'none';
      optionsEl.innerHTML = '';
      nextBtn.style.display = 'none';
      scoreEl.textContent = `Final Score: ${score} / ${quiz.length}`;
      resultEl.textContent = score === quiz.length
        ? "🎉 Perfect! You know your animals!"
        : score >= quiz.length / 2
          ? "👍 Good job! Keep practicing!"
          : "💡 Try again for a better score!";
    }

    // Start game
    showQuestion();
  </script>
</body>
</html>
