<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Search Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f0f4fa;
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 100vw;
      min-height: 100vh;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      min-width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-sizing: border-box;
      background: #f0f4fa;
      padding: 0;
      margin: 0;
      overflow: hidden;
      position: relative; /* Needed for absolute positioning of the button */
    }
    h2 {
      margin: 2vw 0 1vw 0;
      font-size: clamp(1.2em, 3vw, 2em);
      font-weight: 700;
      letter-spacing: 1px;
    }
    #word-list {
      margin-bottom: 1vw;
      font-size: 1.1em;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1vw;
      width: 100vw;
      box-sizing: border-box;
    }
    .word-item {
      background: #cfe2ff;
      color: #0d6efd;
      border: 2px solid #0d6efd;
      border-radius: 8px;
      padding: 0.5em 1.2em;
      margin: 0.2em 0;
      font-weight: bold;
      min-width: 70px;
      text-align: center;
      transition: background 0.2s, color 0.2s, border 0.2s;
      font-size: clamp(0.9em, 2vw, 1.1em);
    }
    .word-item.found {
      background: #d1e7dd;
      color: #198754;
      border-color: #198754;
      text-decoration: line-through;
    }
    #grid-container {
      flex: 1 1 0;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 285px;
      min-width: 0;
      overflow: hidden;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 0.5vw;
      user-select: none;
      width: 70vw;
      height: 60vh;
      max-width: 98vw;
      max-height: 80vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px #0002;
      padding: 1vw;
      box-sizing: border-box;
      overflow: hidden;
    }
    .cell {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      background: #eaf6fb;
      border-radius: 6px;
      border: 2px solid #4f8cff;
      font-size: clamp(1em, 3vw, 1em);
      font-weight: bold;
      color: #4f8cff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border 0.2s;
      position: relative;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    .cell.selected {
      background: #cfe2ff;
      border-color: #0d6efd;
      color: #0d6efd;
    }
    .cell.found {
      background: #d1e7dd;
      border-color: #198754;
      color: #198754;
    }
    #result {
      text-align: center;
      font-size: clamp(1em, 2vw, 1.2em);
      margin-top: 1vw;
      min-height: 1.5em;
    }
    #reset-btn {
      margin: 1vw auto 0 auto;
      padding: 0.7em 2em;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #4f8cff;
      color: #fff;
      cursor: pointer;
      display: block;
      font-weight: 600;
      box-shadow: 0 2px 8px #0001;
    }
    #reset-btn:disabled { background: #ccc; cursor: not-allowed; }
    #score-board {
      display: none; /* Hide the score */
      text-align: center;
      font-size: 1.1em;
      margin-bottom: 1vw;
      color: #0d6efd;
      font-weight: bold;
    }
    #edit-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }
    #edit-modal-content {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 16px #0002;
      max-width: 400px;
      width: 90vw;
      padding: 2em 1.5em 1.5em 1.5em;
      display: flex;
      flex-direction: column;
      gap: 1em;
      align-items: stretch;
      position: relative;
    }
    #edit-panel label {
      font-weight: 600;
      color: #0d6efd;
    }
    #edit-panel textarea {
      width: 100%;
      min-height: 80px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #cfe2ff;
      padding: 0.5em;
      resize: vertical;
    }
    #apply-edit-btn {
      background: #4f8cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5em 1.5em;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5em;
      align-self: flex-end;
    }
    #apply-edit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #close-edit-btn {
      position: absolute;
      top: 0.7em;
      right: 1em;
      background: none;
      border: none;
      font-size: 1.4em;
      color: #888;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }
    #congrats-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
    }
    #congrats-modal-content {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 24px #0003;
      padding: 2.5em 2em;
      text-align: center;
      font-size: 1.4em;
      color: #198754;
      font-weight: bold;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      letter-spacing: 1px;
      animation: popin 0.3s;
    }
    @keyframes popin {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 700px) {
      #game-container { width: 100vw; min-width: 0; padding: 0; }
      #grid {
        width: 98vw;
        height: 98vw;
        max-width: 98vw;
        max-height: 98vw;
        padding: 2vw;
      }
      .cell { font-size: 1em; }
      h2 { font-size: 1.2em; }
    }
    @media (max-width: 500px) {
      #grid {
        width: 99vw;
        height: 99vw;
        max-width: 99vw;
        max-height: 99vw;
        padding: 1vw;
      }
      .cell { font-size: 0.9em; }
    }
    #edit-toggle-btn {
      position: absolute;
      top: 2vw;
      right: 2vw;
      margin-bottom: 0;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h2>Word Search</h2>
    <div id="score-board"></div>
    <div id="edit-panel">
      <div id="edit-modal-content">
        <button id="close-edit-btn" title="Close">&times;</button>
        <label for="words-input">Edit Words (comma or line separated):</label>
        <textarea id="words-input"></textarea>
        <button id="save-edit-btn" style="margin-top:0.5em;background:#198754;">Save</button>
        <div id="save-status" style="font-size:0.95em;color:#198754;margin-top:0.5em;display:none;">Saved!</div>
      </div>
    </div>
    <div id="congrats-modal">
      <div id="congrats-modal-content">
        🎉 Congratulations! You found all the words!
      </div>
    </div>
    <button id="edit-toggle-btn">Edit Game</button>
    <div id="word-list"></div>
    <div id="grid-container">
      <div id="grid"></div>
    </div>
    <div id="result"></div>
    <button id="reset-btn" style="display:none;">Play Again</button>
  </div>
  <script>
  // --- Editable Content State ---
  let words = ["APPLE", "DOG", "HOUSE", "MOON", "RIVER", "SUN", "TREE", "WATER", "FISH", "BOOK"];
  let gridSize = 10;

  // Detect if embedded in quizEditor (by URL param, window name, or parent)
  const isQuizEditor =
    window.location.search.includes('quizEditor') ||
    window.name === 'quizEditor' ||
    (window.parent !== window && window.parent !== null);

  if (isQuizEditor) {
    // Only use quizEditor-specific saved words
    try {
      const saved = localStorage.getItem('quizEditor_game7_words');
      if (saved) {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.every(w => typeof w === 'string')) {
          words = arr;
        }
      }
    } catch (e) {}
  } else {
    // Load saved words from localStorage (ALWAYS, like game1)
    try {
      const saved = localStorage.getItem('game7_words');
      if (saved) {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.every(w => typeof w === 'string')) {
          words = arr;
        }
      }
    } catch (e) {}
  }

  // --- Game State ---
  let grid = [];
  let foundWords = [];
  let selectedCells = [];
  let selecting = false;
  let startCell = null;
  let score = 0;

  const directions = [
    { dx: 1, dy: 0 },   // right
    { dx: 0, dy: 1 },   // down
    { dx: 1, dy: 1 },   // down-right
    { dx: -1, dy: 0 },  // left
    { dx: 0, dy: -1 },  // up
    { dx: -1, dy: -1 }, // up-left
    { dx: 1, dy: -1 },  // up-right
    { dx: -1, dy: 1 }   // down-left
  ];

  function createEmptyGrid() {
    grid = [];
    for (let y = 0; y < gridSize; y++) {
      let row = [];
      for (let x = 0; x < gridSize; x++) {
        row.push({ letter: '', word: null, found: false });
      }
      grid.push(row);
    }
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function placeWords() {
    shuffle(words);
    for (let word of words) {
      let placed = false;
      let tries = 0;
      while (!placed && tries < 100) {
        tries++;
        const dir = directions[Math.floor(Math.random() * directions.length)];
        const x = Math.floor(Math.random() * gridSize);
        const y = Math.floor(Math.random() * gridSize);
        if (canPlace(word, x, y, dir)) {
          for (let i = 0; i < word.length; i++) {
            grid[y + dir.dy * i][x + dir.dx * i].letter = word[i];
            grid[y + dir.dy * i][x + dir.dx * i].word = word;
          }
          placed = true;
        }
      }
    }
    // Fill empty cells with random letters
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        if (!grid[y][x].letter) {
          grid[y][x].letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
        }
      }
    }
  }

  function canPlace(word, x, y, dir) {
    for (let i = 0; i < word.length; i++) {
      let nx = x + dir.dx * i;
      let ny = y + dir.dy * i;
      if (nx < 0 || ny < 0 || nx >= gridSize || ny >= gridSize) return false;
      if (grid[ny][nx].letter && grid[ny][nx].letter !== word[i]) return false;
    }
    return true;
  }

  function renderWordList() {
    const wordList = document.getElementById('word-list');
    wordList.innerHTML = '';
    words.forEach(word => {
      const div = document.createElement('div');
      div.className = 'word-item' + (foundWords.includes(word) ? ' found' : '');
      div.textContent = word;
      wordList.appendChild(div);
    });
  }

  function renderScore() {
    // Score is hidden
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = grid[y][x].letter;
        cell.dataset.x = x;
        cell.dataset.y = y;
        if (grid[y][x].found) cell.classList.add('found');
        if (selectedCells.some(c => c.x === x && c.y === y)) cell.classList.add('selected');
        cell.onmousedown = e => startSelect(x, y);
        cell.onmouseenter = e => selecting && extendSelect(x, y);
        cell.onmouseup = e => endSelect(x, y);
        // Touch support
        cell.ontouchstart = e => { startSelect(x, y); };
        cell.ontouchmove = e => {
          const touch = e.touches[0];
          const target = document.elementFromPoint(touch.clientX, touch.clientY);
          if (target && target.classList.contains('cell')) {
            const tx = parseInt(target.dataset.x, 10);
            const ty = parseInt(target.dataset.y, 10);
            extendSelect(tx, ty);
          }
        };
        cell.ontouchend = e => {
          if (selectedCells.length) {
            const last = selectedCells[selectedCells.length - 1];
            endSelect(last.x, last.y);
          }
        };
        gridEl.appendChild(cell);
      }
    }
    renderScore();
  }

  function startSelect(x, y) {
    if (grid[y][x].found) return;
    selecting = true;
    selectedCells = [{ x, y }];
    startCell = { x, y };
    renderGrid();
  }

  function extendSelect(x, y) {
    if (!selecting || !startCell) return;
    selectedCells = getLineCells(startCell.x, startCell.y, x, y);
    renderGrid();
  }

  function endSelect(x, y) {
    if (!selecting || !startCell) return;
    selecting = false;
    const cells = getLineCells(startCell.x, startCell.y, x, y);
    const word = cells.map(c => grid[c.y][c.x].letter).join('');
    const reversed = word.split('').reverse().join('');
    let found = false;
    if (words.includes(word) && !foundWords.includes(word)) {
      found = word;
    } else if (words.includes(reversed) && !foundWords.includes(reversed)) {
      found = reversed;
    }
    if (found) {
      foundWords.push(found);
      for (let c of cells) grid[c.y][c.x].found = true;
      score++;
      renderWordList();
      renderGrid();
      if (score === words.length) showResult();
    } else {
      setTimeout(() => {
        selectedCells = [];
        renderGrid();
      }, 400);
    }
    selectedCells = [];
    startCell = null;
  }

  function getLineCells(x1, y1, x2, y2) {
    let dx = x2 - x1;
    let dy = y2 - y1;
    let len = Math.max(Math.abs(dx), Math.abs(dy));
    if (len === 0) return [{ x: x1, y: y1 }];
    dx = Math.sign(dx);
    dy = Math.sign(dy);
    let cells = [];
    for (let i = 0; i <= len; i++) {
      let x = x1 + dx * i;
      let y = y1 + dy * i;
      if (x >= 0 && y >= 0 && x < gridSize && y < gridSize) {
        cells.push({ x, y });
      }
    }
    return cells;
  }

  function showResult() {
    // Hide old result text and show modal
    document.getElementById('result').textContent = "";
    document.getElementById('reset-btn').style.display = '';
    document.getElementById('congrats-modal').style.display = 'flex';
    setTimeout(() => {
      document.getElementById('congrats-modal').style.display = 'none';
    }, 2500); // Hide modal after 2.5 seconds (adjust as needed)
  }

  document.getElementById('reset-btn').onclick = startGame;

  function startGame() {
    createEmptyGrid();
    foundWords = [];
    selectedCells = [];
    selecting = false;
    startCell = null;
    score = 0;
    document.getElementById('result').textContent = '';
    document.getElementById('reset-btn').style.display = 'none';
    placeWords();
    renderWordList();
    renderGrid();
  }

  function resizeGrid() {}

  window.addEventListener('resize', resizeGrid);
  const origRenderGrid = renderGrid;
  renderGrid = function() {
    origRenderGrid();
    resizeGrid();
  };

  // --- Editable Content Logic ---
  const editPanel = document.getElementById('edit-panel');
  const editToggleBtn = document.getElementById('edit-toggle-btn');
  const wordsInput = document.getElementById('words-input');
  const closeEditBtn = document.getElementById('close-edit-btn');
  const saveEditBtn = document.getElementById('save-edit-btn');
  const saveStatus = document.getElementById('save-status');

  // Open modal
  editToggleBtn.onclick = function() {
    wordsInput.value = words.join(', ');
    editPanel.style.display = 'flex';
    saveStatus.style.display = 'none';
  };
  // Close modal (X button or click outside)
  closeEditBtn.onclick = function() {
    editPanel.style.display = 'none';
  };
  editPanel.onclick = function(e) {
    if (e.target === editPanel) editPanel.style.display = 'none';
  };

  // Save function (just like game1)
  saveEditBtn.onclick = function() {
    let newWords = wordsInput.value
      .split(/[\n,]+/)
      .map(w => w.trim().toUpperCase())
      .filter(w => w.length > 1 && /^[A-Z]+$/.test(w));
    if (newWords.length === 0) {
      alert("Please enter at least one valid word (letters only, min 2 chars).");
      return;
    }
    if (newWords.some(w => w.length > gridSize)) {
      alert("All words must fit in the grid. Please use shorter words.");
      return;
    }

    // Save to quizEditor-specific key if in quizEditor, else to normal key
    if (isQuizEditor) {
      localStorage.setItem('quizEditor_game7_words', JSON.stringify(newWords));
    } else {
      localStorage.setItem('game7_words', JSON.stringify(newWords));
    }
    saveStatus.textContent = "Saved!";
    saveStatus.style.display = '';
    setTimeout(() => { saveStatus.style.display = 'none'; }, 1200);

    words = newWords;
    startGame();
  };

  function saveQuizSpecificData() {
    if (!isQuizEditor) return;
    const quizId = window.location.pathname.split('/').pop();
    const quizGameData = {
      words: words,
      gridSize: gridSize,
      lastModified: new Date().toISOString(),
      quizId: quizId,
      gameType: 'wordsearch',
      gameUrl: window.location.href.split('?')[0],
      isCustomized: true,
      totalWords: words.length
    };

    window.parent.postMessage({
      type: 'saveQuizGameData',
      gameData: quizGameData,
      quizId: quizId,
      source: 'game-editor'
    }, '*');

    window.parent.postMessage({
      type: 'gameDataUpdate',
      gameData: quizGameData,
      quizId: quizId,
      action: 'immediate-save'
    }, '*');
  }

  // Hide edit button by default, show only in quizEditor
  if (editToggleBtn) {
    editToggleBtn.style.display = 'none';
    if (isQuizEditor) {
      editToggleBtn.style.display = '';
    }
  }

  // Start game on load
  startGame();
  setTimeout(resizeGrid, 50);


  let parentTestIndex = 0;
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'setTestIndex') {
    parentTestIndex = event.data.index;
  }
});


// ...inside saveEditBtn.onclick...
saveEditBtn.onclick = function() {
  let newWords = wordsInput.value
    .split(/[\n,]+/)
    .map(w => w.trim().toUpperCase())
    .filter(w => w.length > 1 && /^[A-Z]+$/.test(w));
  if (newWords.length === 0) {
    alert("Please enter at least one valid word (letters only, min 2 chars).");
    return;
  }
  if (newWords.some(w => w.length > gridSize)) {
    alert("All words must fit in the grid. Please use shorter words.");
    return;
  }

  words = newWords;
  startGame();

  if (isQuizEditor) {
    saveQuizSpecificData();
  }
  saveStatus.textContent = "Saved!";
  saveStatus.style.display = '';
  setTimeout(() => { saveStatus.style.display = 'none'; }, 1200);
};



  </script>
</body>
</html>
